<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OMR 토익</title>
<meta name="theme-color" content="#fbfaf7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OMR 토익">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;500;700&family=Newsreader:opsz,wght@6..72,500;6..72,700&display=swap">
<style>
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: OMR 답안지 — 위쪽 타이밍 마크 띠, 가운데 단일 컬럼, 아래 고정 탭바 */
:root{
  --paper:#fbfaf7; --sheet:#ffffff; --ink:#1d1f24; --muted:#6c6567;
  --omr:#c23b5a; --omr-soft:#f8e3e8; --line:#ecd9de; --mark:#23262d;
  --good:#157a4a; --good-soft:#e1f2e8; --bad:#b42318; --bad-soft:#fbe4e1;
  --omr-ink:#a8304f; --field:#8a8084; --btn:#23262d; --on-btn:#fbfaf7;
  --f-word:"Newsreader",Georgia,"Times New Roman",serif;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#15161a; --sheet:#1d1e23; --ink:#ecebe8; --muted:#a39a9d;
  --omr:#ee7a95; --omr-soft:#3b232b; --line:#3a2c32; --mark:#ecebe8;
  --good:#5cc98f; --good-soft:#173527; --bad:#f2877a; --bad-soft:#3d1f1b;
  --omr-ink:#ee7a95; --field:#8a8084; --btn:#ee7a95; --on-btn:#15161a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#15161a; --sheet:#1d1e23; --ink:#ecebe8; --muted:#a39a9d;
  --omr:#ee7a95; --omr-soft:#3b232b; --line:#3a2c32; --mark:#ecebe8;
  --good:#5cc98f; --good-soft:#173527; --bad:#f2877a; --bad-soft:#3d1f1b;
  --omr-ink:#ee7a95; --field:#8a8084; --btn:#ee7a95; --on-btn:#15161a; color-scheme:dark}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:680px;margin:0 auto}
header.top{padding-block:14px 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;
  border-bottom:2px solid var(--omr);position:relative}
header.top::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;
  background:repeating-linear-gradient(90deg,var(--mark) 0 10px,transparent 10px 22px);opacity:.85}
.brand{font-family:"IBM Plex Mono","IBM Plex Sans KR",monospace;font-weight:600;letter-spacing:.03em;font-size:13px;color:var(--omr);padding-top:10px;margin:0}
.brand b{color:var(--ink);font-family:var(--f-ui);font-size:20px;letter-spacing:0;display:block;font-weight:700}
.sync{font-family:"IBM Plex Mono","IBM Plex Sans KR",monospace;font-size:12px;color:var(--muted);text-align:right}
main{padding-block:18px}
h2{font-size:18px;margin:0;text-wrap:balance}
.eyebrow{font-family:"IBM Plex Mono","IBM Plex Sans KR",monospace;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--omr-ink)}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{border-left:3px solid var(--omr);padding:4px 0 4px 10px}
.tile .n{font-family:var(--f-mono);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.tile .l{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .s{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
button,.btn{font:inherit;font-weight:500;border-radius:6px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);
  padding:10px 14px;cursor:pointer;min-height:44px}
button:hover{border-color:var(--omr)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--omr);outline-offset:2px}
button.primary{background:var(--btn);color:var(--on-btn);border-color:var(--btn)}
button.block{width:100%;min-height:56px;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left}
button.block small{font-family:var(--f-mono);font-size:12px;font-weight:500;opacity:.85}
button.ghost{background:transparent}
button:disabled{opacity:.45;cursor:not-allowed}
button.sm{padding:6px 12px;min-height:44px;font-size:13px}
button.arm{color:var(--bad);border-color:var(--bad)}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--field);border-radius:6px;padding:9px 10px;min-width:0}
textarea{width:100%;min-height:110px;resize:vertical;font-family:var(--f-mono);font-size:16px}
::placeholder{color:var(--muted);opacity:1}
details>summary{min-height:44px;padding:10px 0;cursor:pointer}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);flex:1 1 140px;min-width:0}
.stack>label.f{flex:none}
.chip{display:inline-flex;align-items:center;gap:4px;font-family:"IBM Plex Mono","IBM Plex Sans KR",monospace;font-size:12px;padding:2px 8px;border-radius:99px;
  border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.lv1{border-color:var(--good);color:var(--good)}
.chip.lv2{border-color:var(--omr);color:var(--omr)}
.chip.lv3{background:var(--omr);border-color:var(--omr);color:var(--sheet)}
.progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--omr);transition:width .25s}
/* Word card */
.word{font-family:var(--f-word);font-size:clamp(34px,9vw,48px);font-weight:700;line-height:1.1;letter-spacing:-.01em;word-break:break-word}
.pos{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.ko{font-size:20px;font-weight:700}
.ex{font-family:var(--f-word);font-size:17px;border-left:2px solid var(--line);padding-left:10px}
.grades{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.grades button{display:flex;flex-direction:column;align-items:center;gap:0;padding:8px 4px}
.grades small{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
/* OMR choices */
.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:var(--sheet)}
.bub{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--omr);color:var(--omr);display:grid;place-items:center;
  font-family:var(--f-mono);font-size:12px;font-weight:600}
.choice .t{min-width:0;overflow-wrap:anywhere}
.choice.sel .bub{background:var(--mark);border-color:var(--mark);color:var(--sheet)}
.choice.ok{border-color:var(--good);background:var(--good-soft)}
.choice.ok .bub{background:var(--good);border-color:var(--good);color:var(--sheet)}
.choice.no{border-color:var(--bad);background:var(--bad-soft)}
.choice.no .bub{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.stem{font-family:var(--f-word);font-size:19px;line-height:1.5}
.blank{display:inline-block;min-width:70px;border-bottom:2px solid var(--omr);color:var(--omr);font-family:var(--f-mono);font-size:13px;text-align:center}
.passage{font-family:var(--f-word);font-size:17px;line-height:1.65;white-space:pre-wrap}
.exp{border-radius:6px;padding:10px 12px;font-size:14px}
.exp.ok{background:var(--good-soft)} .exp.no{background:var(--bad-soft)}
/* stats */
.bar{display:grid;grid-template-columns:110px minmax(0,1fr) 72px;gap:8px;align-items:center;font-size:13px}
.bar{cursor:default}.bar[data-t]{cursor:pointer}
.bar .track{height:10px;background:color-mix(in srgb,var(--ink) 12%,transparent);border-radius:5px;overflow:hidden}
.bar .track i{display:block;height:100%}
.bar .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;font-size:12px}
.days{display:flex;gap:4px;align-items:flex-end;height:110px;border-bottom:1px solid var(--line);
  background:repeating-linear-gradient(to top,var(--line) 0 1px,transparent 1px 27.5px)}
.days>div{flex:1;display:flex;flex-direction:column-reverse;gap:1px;height:100%;justify-content:flex-start}
.days i{display:block;width:100%;border-radius:2px 2px 0 0}
.daylbl{display:flex;gap:4px;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.daylbl .today{color:var(--omr-ink);font-weight:600}
.daylbl span{flex:1;text-align:center}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
/* deck list */
.wlist{display:flex;flex-direction:column}
.witem{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.witem .w{font-family:var(--f-word);font-size:18px;font-weight:700}
.witem .k{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.witem .acts{display:flex;gap:8px;align-items:center;justify-content:flex-end}
.witem .acts .chip+.chip{margin-right:auto}
.witem .acts .del{color:var(--bad)}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--sheet);border-top:2px solid var(--omr);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px}
nav.tabs a{color:var(--muted);text-decoration:none;text-align:center;padding:6px 0;border-radius:6px;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:48px;position:relative}
nav.tabs a .m{font-family:var(--f-mono);font-size:15px;font-weight:600}
nav.tabs a[aria-current="page"]{color:var(--omr-ink);background:var(--omr-soft);font-weight:600}
nav.tabs a[aria-current="page"]::after{content:"";position:absolute;top:-8px;left:30%;right:30%;height:3px;background:var(--omr);border-radius:0 0 2px 2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--mark);color:var(--paper);
  padding:9px 14px;border-radius:6px;font-size:13px;z-index:9;max-width:calc(100% - 32px)}
.note{font-size:13px;padding:10px 12px;border:1px dashed var(--omr);border-radius:6px;color:var(--ink)}
.sheet.quiet{background:transparent;border-style:dashed}
.line{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
.gen-out{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:pre-wrap;max-height:120px;overflow:auto}
@media (max-width:420px){.bar{grid-template-columns:84px minmax(0,1fr) 64px}.grid3{gap:6px}.tile .n{font-size:22px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.setup{max-width:460px}
.setup .f input{width:100%}
code{font-family:var(--f-mono);font-size:12px;background:var(--omr-soft);padding:1px 4px;border-radius:3px}
.err{color:var(--bad);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 class="brand">TOEIC · 개인 학습 답안지<b>OMR 토익</b></h1>
    <div class="sync" id="sync">준비 중…</div>
  </header>
  <main id="view"></main>
</div>
<nav class="tabs" aria-label="메뉴"><div class="in">
  <a href="#home" data-v="home"><span class="m" aria-hidden="true">⌂</span>홈</a>
  <a href="#words" data-v="words"><span class="m" aria-hidden="true">Aa</span>단어</a>
  <a href="#p5" data-v="p5"><span class="m" aria-hidden="true">P5</span>문법·어휘</a>
  <a href="#p6" data-v="p6"><span class="m" aria-hidden="true">P6</span>장문</a>
  <a href="#stats" data-v="stats"><span class="m" aria-hidden="true">%</span>분석</a>
  <a href="#deck" data-v="deck"><span class="m" aria-hidden="true">≡</span>단어장</a>
</div></nav>
<div class="toast" id="toast" hidden></div>

<script>
/* =========================================================
   OMR 토익 — 개인용 TOEIC 학습 PWA
   저장소: Supabase (REST, 본인 계정 RLS)   생성: Claude API (본인 키)
   잠금화면 위젯(scriptable/)과 같은 테이블을 공유한다.
   ========================================================= */
const DAY=86400000;
const TYPES5=['품사','동사 형태·시제','수일치·태','대명사','전치사','접속사·접속부사','관계사','비교','특수구문','어휘'];
const TYPES6=[...TYPES5,'문장삽입'];
const LVNAME={1:'기본 · 600점대',2:'중급 · 700~800점대',3:'고난도 · 850점+'};
const LET=['A','B','C','D'];
const MODELS=[['claude-sonnet-5-5','Sonnet 5.5 · 기본'],['claude-haiku-5-5','Haiku 5.5 · 빠르고 저렴'],['claude-opus-5-5','Opus 5.5 · 최고 품질']];
const DEFAULT_SETTINGS={lv5:1.5,lv6:1.5,daily_new:15};
const S={words:new Map(),srs:new Map(),qs:new Map(),days:new Map(),settings:{...DEFAULT_SETTINGS},
  ready:false,view:'home',session:null};
const V=document.getElementById('view');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayId=(t=new Date())=>t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const clone=o=>JSON.parse(JSON.stringify(o||{}));
let toastT;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}
function setSync(m){document.getElementById('sync').textContent=m}

/* ---------- 로컬 설정 (이 기기에만 저장) ---------- */
const LS={get(k){try{return JSON.parse(localStorage.getItem(k))}catch{return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}},del(k){try{localStorage.removeItem(k)}catch{}}};
let CFG=LS.get('omr.cfg')||{};      // {url, anon, email, claudeKey, model}
let TOK=LS.get('omr.tok')||null;    // {access, refresh, exp, uid}

/* ---------- Supabase REST ---------- */
async function authReq(grant,body){
  const r=await fetch(CFG.url+'/auth/v1/token?grant_type='+grant,{method:'POST',headers:{apikey:CFG.anon,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  // 4xx만 "서버가 거절"(비밀번호 틀림, 토큰 폐기)으로 본다. 네트워크 오류·5xx로는 세션을 지우지 않는다.
  if(!r.ok||!j.access_token)throw{code:r.status>=400&&r.status<500?'auth':r.status,message:j.error_description||j.msg||j.message||('로그인 실패 ('+r.status+')')};
  TOK={access:j.access_token,refresh:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1000,uid:j.user.id};LS.set('omr.tok',TOK)}
let refreshing=null;
function dropSession(){TOK=null;LS.del('omr.tok')}
async function token(force){if(!TOK)throw{code:'auth',message:'로그인이 필요해'};
  if(force||Date.now()>TOK.exp-60000){refreshing=refreshing||authReq('refresh_token',{refresh_token:TOK.refresh}).finally(()=>refreshing=null);
    try{await refreshing}catch(e){if(e&&e.code==='auth')dropSession();throw e}}
  return TOK.access}
async function rest(path,{method='GET',body,prefer}={},again=false){
  const h={apikey:CFG.anon,Authorization:'Bearer '+await token(again),'Content-Type':'application/json'};if(prefer)h.Prefer=prefer;
  const r=await fetch(CFG.url+'/rest/v1/'+path,{method,headers:h,body:body===undefined?undefined:JSON.stringify(body)});
  if(r.status===401){if(!again)return rest(path,{method,body,prefer},true);dropSession();throw{code:'auth',message:'로그인이 만료됐어'}}
  const txt=await r.text();if(!r.ok){let m=txt;try{m=JSON.parse(txt).message||txt}catch{}throw{code:r.status,message:m}}
  return txt?JSON.parse(txt):null}
async function selectAll(table){let out=[];for(let from=0;;from+=1000){const rows=await rest(`${table}?select=*&order=${KEYS[table]||'user_id'}&limit=1000&offset=${from}`);out=out.concat(rows);if(rows.length<1000)return out}}
const KEYS={words:'id',srs:'word_id',questions:'id',days:'date',attempts:'id'};
function strip(r){const o={...r};delete o.user_id;return o}
function errText(e){if(e&&e.code==='auth')return'로그인이 만료됐어. 다시 로그인해줘.';if(!navigator.onLine)return'오프라인이야. 연결되면 다시 해줘.';return'저장하지 못했어 ('+(e&&e.code||'오류')+'). '+String(e&&e.message||'').slice(0,80)}
async function upsertMany(table,rows){const kc=KEYS[table];for(let i=0;i<rows.length;i+=200){
  await rest(`${table}?on_conflict=user_id,${kc}`,{method:'POST',body:rows.slice(i,i+200).map(r=>({...r,user_id:TOK.uid})),prefer:'resolution=merge-duplicates,return=minimal'})}}

/* ---------- 저장 대기열: 쓰기는 기기에 먼저 남기고 순서대로 보낸다 (오프라인이어도 기록이 남는다) ---------- */
let OUT=LS.get('omr.out')||[];   // [{k, t:'up'|'del'|'day', table, id, row, args}]
let lastSync='';
function syncLabel(){setSync(OUT.length?'저장 대기 '+OUT.length:lastSync)}
function saveOut(){LS.set('omr.out',OUT);syncLabel()}
function enqueue(op){if(op.k)OUT=OUT.filter(x=>x.k!==op.k);OUT.push(op);saveOut();flush()}
function upsert(table,id,obj){enqueue({k:table+'/'+id,t:'up',table,id,row:clone(obj)})}
function remove(table,id){enqueue({k:table+'/'+id,t:'del',table,id})}
async function sendOp(op){if(!TOK)throw{code:'auth',message:'로그인이 필요해'};
  if(op.t==='day'){const row=await rest('rpc/bump_day',{method:'POST',body:op.args});
    if(row&&row.date)S.days.set(row.date,pendingDays(row.date,strip(row),op));return}
  if(op.t==='del')return rest(`${op.table}?${KEYS[op.table]}=eq.${encodeURIComponent(op.id)}`,{method:'DELETE'});
  const kc=op.table==='settings'?null:KEYS[op.table];const row={...op.row,user_id:TOK.uid};if(kc)row[kc]=op.id;
  return rest(`${op.table}?on_conflict=${kc?'user_id,'+kc:'user_id'}`,{method:'POST',body:[row],prefer:'resolution=merge-duplicates,return=minimal'})}
let flushing=null,flushT=null;
function flush(){if(flushing)return flushing;
  // await 0: 대기열이 비어 있어도 finally 가 flushing 대입 뒤에 돌게 한다 (안 그러면 끝난 promise 가 남아 전송이 멈춘다)
  return flushing=(async()=>{await 0;let fails=0;try{while(OUT.length){const op=OUT[0];
    try{await sendOp(op)}catch(e){
      if(e&&e.code==='auth'){render();return}
      const bad=typeof e.code==='number'&&e.code>=400&&e.code<500&&e.code!==408&&e.code!==429;
      // 서버 오류(5xx)는 그 항목만 뒤로 보내고 나머지를 계속 보낸다. 한 바퀴 다 실패하거나 오프라인이면 남겨 두고 나중에.
      if(!bad&&typeof e.code==='number'&&e.code>=500&&++fails<OUT.length){OUT=[...OUT.filter(x=>x!==op),op];saveOut();continue}
      if(!bad){clearTimeout(flushT);flushT=setTimeout(flush,20000);return}
      console.warn(e);toast(errText(e))}                                     // 데이터 자체가 거절됨: 버린다
    OUT=OUT.filter(x=>x!==op);saveOut()}}finally{flushing=null;syncLabel()}})()}

// days 증가분 (서버 bump_day 와 같은 계산)
function applyDay(d,a){d.words_reviewed=(d.words_reviewed||0)+(a.p_reviewed||0);d.words_new=(d.words_new||0)+(a.p_new||0);d.words_again=(d.words_again||0)+(a.p_again||0);
  d.q=d.q||{};for(const[k,v]of Object.entries(a.p_q||{})){const o=d.q[k]=d.q[k]||{n:0,c:0};o.n+=v.n||0;o.c+=v.c||0}return d}
function pendingDays(date,d,skip){for(const op of OUT)if(op.t==='day'&&op!==skip&&op.args.p_date===date)applyDay(d,op.args);return d}

/* ---------- SRS (SM-2) — scriptable/ 위젯과 같은 규칙 ---------- */
function nextOf(s,q){s={ef:2.5,reps:0,ivl:0,lapses:0,...(s||{})};const now=Date.now();
  if(q<3){s.reps=0;s.ivl=0;s.lapses=(s.lapses||0)+1;s.due=now+10*60000}
  else{s.reps++;s.ivl=s.reps===1?1:s.reps===2?3:Math.round(s.ivl*s.ef);if(q===5)s.ivl=Math.max(2,Math.round(s.ivl*1.3));
    s.ef=Math.max(1.3,s.ef+0.1-(5-q)*(0.08+(5-q)*0.02));s.due=now+s.ivl*DAY}
  s.last=now;return s}
function ivLabel(s,q){const n=nextOf(s,q);return n.ivl===0?'10분':n.ivl+'일'}
function gradeWord(id,q){const isNew=!S.srs.has(id);const s=nextOf(S.srs.get(id),q);S.srs.set(id,s);upsert('srs',id,s);
  bumpDay({p_reviewed:1,p_new:isNew?1:0,p_again:q<3?1:0})}
function buildQueue(){const now=Date.now();
  const due=[...S.srs.entries()].filter(([id,s])=>s.due<=now&&S.words.has(id)).sort((a,b)=>a[1].due-b[1].due).map(x=>x[0]);
  const left=Math.max(0,(S.settings.daily_new??15)-((S.days.get(todayId())||{}).words_new||0));
  const fresh=[...S.words.entries()].filter(([id])=>!S.srs.has(id))
    .sort((a,b)=>(a[1].lv||1)-(b[1].lv||1)||(a[1].created||0)-(b[1].created||0)).slice(0,left).map(x=>x[0]);
  return{due,fresh,left}}
function wordStatus(id){const s=S.srs.get(id);if(!s)return'new';return s.ivl>=21?'mature':'learning'}

/* ---------- 통계 ---------- */
function typeStats(part){const agg={};for(const d of S.days.values()){for(const[k,v]of Object.entries(d.q||{})){const[p,t]=k.split(':');if(+p!==part)continue;
  agg[t]=agg[t]||{n:0,c:0};agg[t].n+=v.n;agg[t].c+=v.c}}return agg}
function weakTypes(part){return Object.entries(typeStats(part)).filter(([,v])=>v.n>=3).sort((a,b)=>a[1].c/a[1].n-b[1].c/b[1].n).slice(0,3).map(x=>x[0])}
function streak(){let n=0;const t=new Date();for(let i=0;i<400;i++){const d=S.days.get(todayId(new Date(t.getTime()-i*DAY)));
  const act=d&&(d.words_reviewed||Object.values(d.q||{}).some(v=>v.n));if(act)n++;else if(i>0)break}return n}
function lvText(x){return x.toFixed(1)+' · '+LVNAME[Math.round(x)].split(' · ')[0]}

/* ---------- 단어 학습 ---------- */
/* ---------- 단어 학습: 익히기 → 뜻 고르기 → 예문 빈칸 ----------
   새 단어는 세 단계를 차례로 거치고, 복습 단어는 예문 빈칸 하나로 시험한다(예문이 없으면 뜻 고르기).
   다음 단계와 틀린 단계는 WGAP장 뒤에 다시 낸다. 채점(nextOf)은 단어가 마지막 단계를 통과할 때 한 번만 한다:
   한 번도 안 틀림 4 / 새 단어인데 틀린 적 있음 3 / 복습 단어인데 틀림 1. */
const WGAP=3,WSTEP={learn:'익히기',mean:'뜻 고르기',blank:'예문 빈칸'};
// 예문에서 표제어(활용형 포함) 위치를 찾는다. 못 찾으면 null
function blankOf(w){if(!w||!w.ex||!w.w)return null;const t=w.w.trim();const stem=t.length>4?t.slice(0,Math.max(4,t.length-2)):t;
  const m=w.ex.match(new RegExp('\\b'+stem.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'[A-Za-z]*','i'));if(!m)return null;
  return{pre:w.ex.slice(0,m.index),hit:m[0],post:w.ex.slice(m.index+m[0].length)}}
function exHtml(w){const b=blankOf(w);return b?esc(b.pre)+'<b>'+esc(b.hit)+'</b>'+esc(b.post):esc(w.ex||'')}
// 보기 4개: 같은 품사를 먼저, 같은 글자는 한 번만
function wOpts(id,key){const w=S.words.get(id);const seen=new Set([w[key]]);const out=[];
  for(const[,o]of shuffle([...S.words.entries()].filter(([k])=>k!==id)).sort((a,b)=>(b[1].pos===w.pos)-(a[1].pos===w.pos))){
    if(!o[key]||seen.has(o[key]))continue;seen.add(o[key]);out.push(o[key]);if(out.length===3)break}
  return shuffle([w[key],...out])}
function rWords(){
  if(!S.session||S.session.view!=='words'){const q=buildQueue();
    V.innerHTML=`<div class="stack"><div><div class="eyebrow">간격 반복 · SM-2</div><h2>단어 학습</h2></div>
    <div class="sheet stack"><div class="grid3">
      <div class="tile"><div class="n">${q.due.length}</div><div class="l">복습 예정</div></div>
      <div class="tile"><div class="n">${q.fresh.length}</div><div class="l">새 단어</div><div class="s">한도 ${q.left}</div></div>
      <div class="tile"><div class="n">${S.words.size}</div><div class="l">전체 단어</div></div></div>
      <div class="row"><button class="primary" id="ws1" ${q.due.length+q.fresh.length?'':'disabled'}>학습 시작</button></div>
      ${q.due.length+q.fresh.length?'':`<div class="muted" style="font-size:14px">${S.words.size?'오늘 분량을 다 끝냈어. 새 단어 한도는 단어장 탭에서 바꿀 수 있어.':'단어가 없어. 홈에서 기본 단어를 불러오거나 단어장에서 추가해줘.'}</div>`}
    </div>
    <div class="muted" style="font-size:13px">새 단어: 익히기 → 뜻 고르기 → 예문 빈칸 순서로 나와. 복습 단어: 예문 빈칸으로 바로 시험해. 틀리면 몇 장 뒤에 다시 나오고, 맞힐 때까지 반복해.</div></div>`;
    ws1.onclick=()=>startWords();return}
  const s=S.session;if(s.i>=s.list.length){finishWords();return}
  const id=s.list[s.i];const w=S.words.get(id);if(!w){s.i++;return rWords()}
  const t=s.st.get(id);const step=t.steps[t.k];
  let need=0,got=0,wd=0;for(const x of s.st.values()){need+=x.steps.length;got+=x.k;if(x.k>=x.steps.length)wd++}
  const head=`<div class="row" style="justify-content:space-between"><span class="eyebrow">단어 ${wd} / ${s.st.size} 끝</span>
    <span class="row" style="gap:6px"><span class="chip">${t.isNew?'새 단어':'복습'} · ${WSTEP[step]}</span><span class="chip lv${w.lv||1}">L${w.lv||1}</span>
    <button class="sm ghost" id="wq">그만하기</button></span></div><div class="progress"><i style="width:${Math.round(got/need*100)}%"></i></div>`;
  clearTimeout(autoT);
  if(step==='learn'){
    V.innerHTML=`<div class="stack">${head}<div class="sheet stack" style="min-height:260px">
      <div><div class="word">${esc(w.w)}</div><div class="pos">${esc(w.pos||'')}</div></div>
      <div class="ko">${esc(w.ko)}</div>${w.ex?`<div class="ex">${exHtml(w)}</div>`:''}
      <div class="muted" style="font-size:13px">뜻과 예문을 읽어 둬. 조금 뒤에 시험해.</div></div>
      <button class="primary" id="wnext">다음</button></div>`;
    wnext.onclick=()=>wDone(true);armTwice(wq,()=>finishWords());return}
  const key=step==='mean'?'ko':'w';if(!s.opts)s.opts=wOpts(id,key);
  const done=s.picked!=null;const ok=done&&s.opts[s.picked]===w[key];const b=step==='blank'?blankOf(w):null;
  const prompt=step==='blank'
    ?`<div class="stem">${done?exHtml(w):esc(b.pre)+'<b>-------</b>'+esc(b.post)}</div>${done?'':'<div class="muted" style="font-size:13px">빈칸에 맞는 단어를 골라. 보기는 기본형이야.</div>'}`
    :`<div><div class="word">${esc(w.w)}</div><div class="pos">${esc(w.pos||'')}</div></div>`;
  V.innerHTML=`<div class="stack">${head}<div class="sheet stack">${prompt}
    <div class="choices">${s.opts.map((o,i)=>{const cls=done?(o===w[key]?'ok':i===s.picked?'no':''):'';
      return`<button class="choice ${cls}" data-i="${i}" ${done?'disabled':''}><span class="bub">${i+1}</span><span class="t">${esc(o)}</span></button>`}).join('')}</div>
    ${done?`<div class="exp ${ok?'ok':'no'}"><b>${ok?'정답':'오답'}</b> ${esc(w.w)} <span class="muted">${esc(w.pos||'')}</span> ${esc(w.ko)}${step==='mean'&&w.ex?`<div class="ex" style="margin-top:6px">${exHtml(w)}</div>`:''}${ok?'':'<div class="muted" style="font-size:13px;margin-top:4px">몇 장 뒤에 다시 나와.</div>'}</div>`:''}</div>
    ${done?`<button class="primary" id="wnext">다음</button>`:''}</div>`;
  V.querySelectorAll('.choice').forEach(c=>c.onclick=()=>answerWord(+c.dataset.i));
  armTwice(wq,()=>finishWords());
  if(done){wnext.onclick=()=>wDone(ok);
    // 정답이면 1.2초 뒤 자동으로 넘긴다(P5와 같음). 설명을 누르면 멈춘다.
    if(ok){autoT=setTimeout(()=>{if(S.session===s&&s.picked!=null)wDone(true)},1200);
      const ex=V.querySelector('.exp');ex.style.cursor='pointer';ex.onclick=()=>{clearTimeout(autoT);wnext.textContent='다음'};wnext.textContent='다음 (자동)'}}}
function startWords(){const q=buildQueue();const st=new Map();
  for(const id of q.due){const w=S.words.get(id);st.set(id,{isNew:false,steps:[blankOf(w)?'blank':'mean'],k:0,miss:0})}
  for(const id of q.fresh){const w=S.words.get(id);st.set(id,{isNew:true,steps:['learn','mean',...(blankOf(w)?['blank']:[])],k:0,miss:0})}
  S.session={view:'words',list:[...q.due,...q.fresh],i:0,st,opts:null,picked:null,stats:{n:0,ok:0}};rWords()}
function answerWord(i){const s=S.session;if(!s||s.picked!=null||!s.opts||i<0||i>=s.opts.length)return;s.picked=i;rWords()}
// 지금 단계를 끝낸다. 맞으면 다음 단계로, 틀리면 같은 단계를 WGAP장 뒤에 다시
function wDone(ok){const s=S.session;clearTimeout(autoT);const id=s.list[s.i];const t=s.st.get(id);
  if(ok)t.k++;else t.miss++;
  if(t.k>=t.steps.length){gradeWord(id,t.miss?(t.isNew?3:1):4);t.graded=true;s.stats.n++;if(!t.miss)s.stats.ok++}
  else s.list.splice(Math.min(s.i+1+WGAP,s.list.length),0,id);
  s.i++;s.opts=null;s.picked=null;rWords()}
function finishWords(){const s=S.session;clearTimeout(autoT);
  // 중간에 그만둔 경우: 복습 단어 중 틀리고 아직 못 맞힌 것은 틀림(1)으로 기록. 새 단어는 다 못 거쳤으면 새 단어로 남긴다
  for(const[id,t]of s.st)if(!t.graded&&t.miss&&!t.isNew){gradeWord(id,1);t.graded=true;s.stats.n++}
  const st=s.stats;const miss=[...s.st].filter(([,t])=>t.miss).map(([id])=>S.words.get(id)).filter(Boolean);
  const left=[...s.st.values()].filter(t=>!t.graded&&t.isNew&&t.k>0).length;S.session=null;
  V.innerHTML=`<div class="stack"><div><div class="eyebrow">세션 완료</div><h2>${st.n}개 학습 · 한 번에 맞힘 ${st.ok}개</h2></div>
  ${left?`<div class="muted" style="font-size:14px">다 못 거친 새 단어 ${left}개는 다음에 처음부터 다시 나와.</div>`:''}
  ${miss.length?`<div class="sheet"><div class="eyebrow" style="margin-bottom:4px">틀렸던 단어 ${miss.length}개</div>${miss.map(w=>`<div class="witem"><div><span class="w">${esc(w.w)}</span> <span class="k">${esc(w.ko)}</span></div></div>`).join('')}</div>`:''}
  <div class="row"><button class="primary" id="fw1">단어 학습으로</button><button id="fw2">Part 5 풀기</button></div></div>`;
  fw1.onclick=()=>rWords();fw2.onclick=()=>location.hash='p5'}
document.addEventListener('keydown',e=>{const s=S.session;if(e.ctrlKey||e.metaKey||e.altKey||!s||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  if(s.view==='words'){const t=s.st.get(s.list[s.i]);if(!t)return;const step=t.steps[t.k];
    if(step==='learn'){if(e.key===' '||e.key==='Enter'){e.preventDefault();wDone(true)}}
    else if(s.picked==null&&'1234'.includes(e.key)&&e.key.length===1)answerWord(+e.key-1);
    else if(s.picked!=null&&e.key==='Enter'){e.preventDefault();const w=S.words.get(s.list[s.i]);wDone(s.opts[s.picked]===w[step==='mean'?'ko':'w'])}}
  else if(s.view==='p5'&&s.picked==null&&e.key.length===1&&'abcdABCD1234'.includes(e.key)){const i='abcd'.indexOf(e.key.toLowerCase());answerP5(i>=0?i:+e.key-1)}
  else if(s.view==='p5'&&s.picked!=null&&e.key==='Enter'){nextP5()}});

/* ---------- Part 5 / 6 ---------- */
function pool(part){return[...S.qs.entries()].filter(([,q])=>q.part===part)}
function pick(part,n,type){const lv=Math.round(S.settings['lv'+part]);
  return pool(part).filter(([,q])=>!type||q.type===type).map(([id,q])=>[id,Math.abs((q.level||1)-lv)*10+(q.seen?(q.last_ok?6:2):0)+Math.random()*2]).sort((a,b)=>a[1]-b[1]).slice(0,n).map(x=>x[0])}
function unseenAt(part){const lv=Math.round(S.settings['lv'+part]);return pool(part).filter(([,q])=>!q.seen&&(q.level||1)===lv).length}
function adjustLv(part,q,ok){const k='lv'+part;const lv=S.settings[k];S.settings[k]=clamp(lv+(ok?((q.level||1)>=Math.round(lv)?0.12:0.05):-0.15),1,3)}
// 마지막으로 풀었을 때 틀린 문제 (오래된 것부터)
function wrongIds(part){return pool(part).filter(([,q])=>q.last_ok===false).sort((a,b)=>(a[1].last_at||0)-(b[1].last_at||0)).map(x=>x[0])}
// results: [{type, ok, picked, answer, item}]. 풀이 1회마다 attempts 에 고른 보기를 남긴다 (약점 분석용).
function recordQ(id,q,results,review){const wrong=results.filter(r=>!r.ok).length;const now=Date.now();
  const nq={...clone(q),seen:(q.seen||0)+1,wrong:(q.wrong||0)+(wrong?1:0),last_ok:!wrong,last_at:now};
  S.qs.set(id,nq);upsert('questions',id,nq);
  results.forEach((r,k)=>{const aid=now.toString(36)+'-'+k+'-'+Math.random().toString(36).slice(2,6);
    upsert('attempts',aid,{at:now,qid:id,part:q.part,item:r.item||0,type:r.type,level:q.level||1,picked:r.picked,answer:r.answer,ok:r.ok,review:!!review})});
  const p_q={};for(const r of results){const key=q.part+':'+r.type;const o=p_q[key]=p_q[key]||{n:0,c:0};o.n++;if(r.ok)o.c++}
  bumpDay({p_q})}

// review: 오답 다시 풀기. 정답을 이미 본 문제라 레벨은 조정하지 않는다.
function startP5(review,only){const ids=only||(review?shuffle(wrongIds(5)).slice(0,10):pick(5,10));if(!ids.length){toast(review?'다시 풀 틀린 문제가 없어':'풀 문제가 없어');return}

function rP5(){const s=S.session;if(s.i>=s.list.length)return finishQ(5);const id=s.list[s.i];const q=S.qs.get(id);if(!q){s.i++;return rP5()}

  clearTimeout(autoT);if(done&&ok){autoT=setTimeout(()=>{if(S.session===s&&s.picked!=null)nextP5()},1200);
    const ex=V.querySelector('.exp');if(ex){ex.style.cursor='pointer';ex.onclick=()=>{clearTimeout(autoT);pn.textContent='다음'}}pn.textContent='다음 (자동)'}}
let autoT=null;
function answerP5(i){const s=S.session;if(s.picked!=null||i<0||i>3)return;const id=s.list[s.i];const q=S.qs.get(id);s.picked=i;const ok=i===q.answer;if(ok)s.ok++;else s.miss.push(id);
  recordQ(id,q,[{type:q.type,ok,picked:i,answer:q.answer,item:0}],s.review);if(!s.review){adjustLv(5,q,ok);saveSettings()}rP5()}
function nextP5(){clearTimeout(autoT);const s=S.session;if(!s)return;s.i++;s.picked=null;rP5()}

function startP6(review,only){const ids=only||(review?wrongIds(6).slice(0,1):pick(6,1));if(!ids.length){toast(review?'다시 풀 틀린 지문이 없어':'풀 지문이 없어');return}
  S.session={view:'p6',list:ids,i:0,ans:{},graded:false,ok:0,total:0,review:!!review,miss:[],lv0:S.settings.lv6};rP6()}
function nextP6(s,id){return(s.review?wrongIds(6):pick(6,3)).filter(x=>!s.list.includes(x)&&x!==id)[0]}
function rP6(){const s=S.session;if(s.i>=s.list.length)return finishQ(6);const id=s.list[s.i];const q=S.qs.get(id);
  const base=131;const g=s.graded;
  const passage=esc(q.passage).replace(/\[(\d)\]/g,(m,n)=>`<span class="blank">${base+(+n)-1}</span>`);
  V.innerHTML=`<div class="stack"><div class="row" style="justify-content:space-between"><span class="eyebrow">${esc(q.title||'Part 6')}</span>

    <div class="sheet"><div class="passage">${passage}</div></div>
    ${q.items.map((it,k)=>{const a=s.ans[k];return`<div class="sheet stack"><div class="row" style="justify-content:space-between"><b>${base+k}번</b>${g?`<span class="chip">${esc(it.type)}</span>`:''}</div>
      <div class="choices">${it.choices.map((c,i)=>{const cls=g?(i===it.answer?'ok':i===a?'no':''):(i===a?'sel':'');
        return`<button class="choice ${cls}" data-k="${k}" data-i="${i}" ${g?'disabled':''}><span class="bub">${LET[i]}</span><span class="t">${esc(c)}</span></button>`}).join('')}</div>
      ${g?`<div class="exp ${a===it.answer?'ok':'no'}"><b>${a===it.answer?'정답':'오답 · 정답 ('+LET[it.answer]+')'}</b> ${esc(it.exp)}</div>`:''}</div>`}).join('')}
    ${g?`<button class="primary" id="p6n">${nextP6(s,id)?'다음 지문':'결과 보기'}</button>`:`<button class="primary" id="p6g" ${Object.keys(s.ans).length===q.items.length?'':'disabled'}>채점하기</button>`}</div>`;
  V.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(s.graded)return;s.ans[+b.dataset.k]=+b.dataset.i;const y=window.scrollY;rP6();window.scrollTo(0,y)});
  armTwice(pq,()=>finishQ(6));
  if(g)p6n.onclick=()=>{const nx=nextP6(s,id);if(!nx)return finishQ(6);s.list.push(nx);s.i++;s.ans={};s.graded=false;rP6();window.scrollTo(0,0)};
  else p6g.onclick=()=>{s.graded=true;const res=q.items.map((it,k)=>({type:it.type,ok:s.ans[k]===it.answer,picked:s.ans[k],answer:it.answer,item:k}));
    res.forEach(r=>{s.total++;if(r.ok)s.ok++;if(!s.review)adjustLv(6,q,r.ok)});if(res.some(r=>!r.ok))s.miss.push(id);recordQ(id,q,res,s.review);if(!s.review)saveSettings();const y=window.scrollY;rP6();window.scrollTo(0,y)}}
function finishQ(part){const s=S.session;S.session=null;
  const n=part===5?Math.min(s.i+(s.picked!=null?1:0),s.list.length):s.total;const ok=s.ok;
  V.innerHTML=`<div class="stack"><div><div class="eyebrow">Part ${part} 세션 완료</div><h2>${n}문제 중 ${ok}개 정답${n?' · '+Math.round(ok/n*100)+'%':''}</h2></div>
  <div class="muted">${s.review?'오답 다시 풀기라 레벨은 그대로야':'레벨 '+s.lv0.toFixed(1)+' → '+lvText(S.settings['lv'+part])}</div>
  <div class="row">${s.miss.length?`<button class="primary" id="f0">방금 틀린 ${s.miss.length}개 다시</button>`:''}<button class="${s.miss.length?'':'primary'}" id="f1">한 번 더</button><button id="f2">약점 분석</button></div></div>`;
  if(s.miss.length)f0.onclick=()=>part===5?startP5(true,s.miss):startP6(true,s.miss.slice(0,1));
  f1.onclick=()=>part===5?startP5(s.review):startP6(s.review);f2.onclick=()=>location.hash='stats'}

/* ---------- Claude API ---------- */
let genCtl=null;
async function claude(prompt,signal){
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal,
    headers:{'x-api-key':CFG.claudeKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true','content-type':'application/json'},
    body:JSON.stringify({model:CFG.model||MODELS[0][0],max_tokens:6000,messages:[{role:'user',content:prompt}]})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw{code:r.status,message:(j.error&&j.error.message)||('HTTP '+r.status)};
  return{text:(j.content||[]).filter(c=>c.type==='text').map(c=>c.text).join(''),stop:j.stop_reason}}
// 문자열 안을 건너뛰며 괄호 짝이 맞는 최상위 {...} 를 순서대로 뽑는다. 응답이 중간에 잘려도 완성된 문항은 살린다.
function objectsIn(t){const out=[];let d=0,s=-1,str=false,bs=false;for(let i=0;i<t.length;i++){const c=t[i];
  if(str){if(bs)bs=false;else if(c==='\\')bs=true;else if(c==='"')str=false;continue}
  if(c==='"')str=true;else if(c==='{'){if(!d)s=i;d++}else if(c==='}'&&d){d--;if(!d){try{out.push(JSON.parse(t.slice(s,i+1)))}catch{}}}}return out}
function parseJSON(t,want){try{return JSON.parse(t)}catch{}const m=t.match(/```(?:json)?\s*([\s\S]*?)```/);if(m){try{return JSON.parse(m[1])}catch{}}
  const o=want==='array'?'[':'{',c=want==='array'?']':'}';const s=t.indexOf(o),e=t.lastIndexOf(c);if(s>=0&&e>s){try{return JSON.parse(t.slice(s,e+1))}catch{}}
  const objs=objectsIn(s>=0?t.slice(s):t);if(objs.length)return want==='array'?objs:objs[0];
  throw{code:'json',message:'응답 형식이 깨졌어'}}
const okAns=a=>Number.isInteger(a)&&a>=0&&a<4;
const uniq4=c=>Array.isArray(c)&&c.length===4&&c.every(x=>typeof x==='string'&&x.trim())&&new Set(c.map(x=>x.trim().toLowerCase())).size===4;
function validP5(x){return!!x&&typeof x.stem==='string'&&(x.stem.match(/-{3,}/g)||[]).length===1&&uniq4(x.choices)&&okAns(x.answer)}
// Part 6: 빈칸 [1]~[4] 각각 정확히 한 번, 문항 4개, 문장삽입 정확히 1개
function validP6(x){if(!x||typeof x.passage!=='string'||!Array.isArray(x.items)||x.items.length!==4)return false;
  if([1,2,3,4].some(n=>x.passage.split('['+n+']').length!==2)||/\[[05-9]\]/.test(x.passage))return false;
  return x.items.filter(it=>it&&it.type==='문장삽입').length===1&&x.items.every(it=>it&&uniq4(it.choices)&&okAns(it.answer))}
// 정답 위치는 코드에서 섞는다 (모델에게만 맡기면 한쪽으로 몰린다)
function mix(choices,answer){const idx=shuffle([0,1,2,3]);return{choices:idx.map(i=>String(choices[i]).trim()),answer:idx.indexOf(answer)}}
function genPrompt(part,lv,weak){
  const lvDesc={1:'Level 1 (target score ~600): common business vocabulary, clear grammar cues.',2:'Level 2 (target ~750): subtler grammar, collocations, distractors from the same word family.',3:'Level 3 (target 850+): advanced vocabulary, inversion, subjunctive, close-meaning distractors, long sentences.'}[lv];
  const focus=weak.length?`Give extra weight to these weak question types: ${weak.join(', ')}.`:'Mix the question types.';
  const existing=pool(part).slice(-30).map(([,q])=>part===5?q.stem:q.title).join('\n');
  return part===5?
`Write 8 ORIGINAL TOEIC Part 5 (incomplete sentence) questions. ${lvDesc} ${focus}
Allowed "type" values (Korean, use exactly): ${TYPES5.join(', ')}.
Each question: one business-context English sentence with exactly one blank written as "-------", four answer choices, exactly one correct.
Do not copy any published test item. Choices are shuffled after you answer, so in "exp" name choices by the word itself, never by letter (A-D) or position. Avoid repeating these existing stems:
${existing||'(none)'}
Reply with ONLY a JSON array of 8 objects, no other text:
[{"type":"품사","stem":"The manager asked for a ------- review of the budget.","choices":["thorough","thoroughly","thoroughness","more thoroughly"],"answer":0,"exp":"명사 review를 꾸미는 형용사 자리라 thorough가 정답. 부사 thoroughly는 명사를 꾸밀 수 없어."}]
"exp" must be Korean (casual 반말), 1-2 sentences, explaining why the answer is right and why the trap is wrong.`:
`Write 1 ORIGINAL TOEIC Part 6 text-completion set. ${lvDesc} ${focus}
Text: an email, notice, memo, article or letter of 90-150 words with exactly four blanks marked [1], [2], [3], [4] in order. Exactly one of the four must be a sentence-insertion item (type "문장삽입") whose choices are four full sentences.
Allowed "type" values (Korean, use exactly): ${TYPES6.join(', ')}.
Do not copy any published test item. Choices are shuffled after you answer, so in "exp" name choices by the word itself, never by letter (A-D) or position. Avoid these existing titles:
${existing||'(none)'}
Reply with ONLY one JSON object, no other text:
{"title":"Email: Office Relocation","passage":"... [1] ... [2] ... [3] ... [4] ...","items":[{"type":"품사","choices":["a","b","c","d"],"answer":0,"exp":"한국어 해설 1~2문장 (반말)"}]}  (items has exactly 4 entries)`}
async function generate(part){if(!CFG.claudeKey)return;if(!navigator.onLine){toast('오프라인이야. 연결되면 만들어줘');return}const lv=Math.round(S.settings['lv'+part]);const weak=weakTypes(part);
  const out=document.getElementById('qgo'),btn=document.getElementById('qg'),stop=document.getElementById('qstop');
  btn.disabled=true;stop.hidden=false;out.hidden=false;out.textContent='Claude가 문제를 쓰는 중… (20~60초)';
  genCtl=new AbortController();stop.onclick=()=>genCtl.abort();
  try{const{text,stop:reason}=await claude(genPrompt(part,lv,weak),genCtl.signal);const res=parseJSON(text,part===5?'array':'object');let saved=0,dropped=0;const now=Date.now();
    const rows=[];
    if(part===5){for(const x of(Array.isArray(res)?res:[])){if(!validP5(x)){dropped++;continue}const m=mix(x.choices,x.answer);
        rows.push({id:'c'+now.toString(36)+'-'+rows.length,part:5,level:lv,type:TYPES5.includes(x.type)?x.type:'어휘',stem:x.stem.trim(),choices:m.choices,answer:m.answer,exp:String(x.exp||''),title:null,passage:null,items:null,src:'claude',created:now+rows.length,seen:0,wrong:0})}}
    else{const x=res||{};
      if(validP6(x))rows.push({id:'c'+now.toString(36),part:6,level:lv,type:null,stem:null,choices:null,answer:null,exp:null,title:String(x.title||'Part 6'),passage:x.passage,
          items:x.items.map(it=>({type:TYPES6.includes(it.type)?it.type:'어휘',...mix(it.choices,it.answer),exp:String(it.exp||'')})),src:'claude',created:now,seen:0,wrong:0});
      else dropped++}
    for(const r of rows){const{id,...doc}=r;S.qs.set(id,r);upsert('questions',id,doc)}saved=rows.length;
    // 해설에 "A가 정답" 처럼 보기 글자를 쓰면 섞은 뒤 틀린 말이 된다. 프롬프트에서 보기 글자 언급을 막아 둔다.
    const cut=reason==='max_tokens'?' 응답이 길어서 잘렸어.':'';
    out.textContent=saved?`${saved}개 저장했어 (레벨 ${lv}).${dropped?' 형식이 틀린 '+dropped+'개는 버렸어.':''}${cut}`:'형식이 맞는 결과가 없어서 저장하지 않았어.'+cut+' 다시 눌러줘.';
    toast(saved?'새 문제 '+saved+'개 저장':'저장된 문제 없음');setTimeout(()=>{if(!S.session&&S.view==='p'+part)rQuiz(part)},1200)}
  catch(e){const m=e&&e.name==='AbortError'?'중지했어.':e.code===401?'API 키가 올바르지 않아. 설정에서 다시 넣어줘.':e.code===429?'요청 한도에 걸렸어. 잠시 후 다시 해줘.':e.code===529||e.code===503?'Claude 서버가 바빠. 잠시 후 다시 해줘.':(e.code===400||e.code===404)&&/model/i.test(e.message||'')?'모델 이름이 맞지 않아. 설정에서 다른 모델을 골라줘.':e.code==='json'?'응답 형식이 깨졌어. 다시 눌러줘.':'생성하지 못했어: '+String(e.message||e.code||'오류').slice(0,120);
    out.textContent=m}
  finally{genCtl=null;btn.disabled=false;stop.hidden=true}}

/* ---------- 분석 ---------- */
function rStats(){const bars=part=>{const st=typeStats(part);const rows=Object.entries(st).sort((a,b)=>a[1].c/a[1].n-b[1].c/b[1].n);
    if(!rows.length)return'<div class="muted" style="font-size:13px">아직 풀이 기록이 없어.</div>';
    return rows.map(([t,v])=>{const p=Math.round(v.c/v.n*100);const col=p>=80?'var(--good)':p>=60?'var(--omr)':'var(--bad)';
      return`<div class="bar" ${part===5?`data-t="${esc(t)}" role="button" tabindex="0" aria-label="${esc(t)} 5문제 풀기"`:''}><span>${esc(t)}</span><span class="track"><i style="width:${p}%;background:${col}"></i></span><span class="v">${p}% · ${v.c}/${v.n}</span></div>`}).join('')};
  const tot=part=>{let n=0,c=0;for(const v of Object.values(typeStats(part))){n+=v.n;c+=v.c}return n?Math.round(c/n*100)+'%':'–'};
  const days=[];let mx=1;for(let i=13;i>=0;i--){const t=new Date(Date.now()-i*DAY);const d=S.days.get(todayId(t))||{};let qn=0;for(const v of Object.values(d.q||{}))qn+=v.n;
    days.push({l:t.getDate(),w:d.words_reviewed||0,q:qn,today:i===0});mx=Math.max(mx,(d.words_reviewed||0)+qn)}
  const active=days.filter(d=>d.w||d.q).length;
  // 맨 위 한 줄: 가장 약한 유형과 이번 주/지난주 P5 정답률 (표본이 적으면 말하지 않는다)
  const wk=(from,to)=>{let n=0,c=0;for(let i=from;i<to;i++){const d=S.days.get(todayId(new Date(Date.now()-i*DAY)))||{};for(const[k,v]of Object.entries(d.q||{}))if(k.startsWith('5:')){n+=v.n;c+=v.c}}return{n,c}};
  const w1=wk(0,7),w0=wk(7,14);const weak5=weakTypes(5)[0];const ws=weak5&&typeStats(5)[weak5];
  const pct=o=>Math.round(o.c/o.n*100)+'%';
  const head=ws?`<div class="sheet stack"><div class="line"><span>가장 약한 유형 <b>${esc(weak5)}</b> ${pct(ws)} <span class="muted">(n=${ws.n})</span></span><button class="sm primary" id="sweak">${esc(weak5)} 5문제</button></div>
    ${w1.n>=5?`<div class="muted" style="font-size:13px">P5 정답률 이번 주 ${pct(w1)} (n=${w1.n})${w0.n>=5?' · 지난주 '+pct(w0)+' (n='+w0.n+')':''}</div>`:''}</div>`
    :`<div class="note">유형별로 3문제 이상 풀면 가장 약한 유형을 여기 보여줄게.</div>`;
  let nw=0,ln=0,mt=0;for(const id of S.words.keys()){const s=wordStatus(id);s==='new'?nw++:s==='mature'?mt++:ln++}
  const hard=[...S.srs.entries()].filter(([id,s])=>s.lapses&&S.words.has(id)).sort((a,b)=>b[1].lapses-a[1].lapses).slice(0,8);
  V.innerHTML=`<div class="stack"><div><div class="eyebrow">약점 분석</div><h2>유형별 정답률</h2></div>
  ${head}
  <div class="sheet stack"><div class="row" style="justify-content:space-between"><b>Part 5</b><span class="muted" style="font-size:13px">전체 ${tot(5)} · 레벨 ${lvText(S.settings.lv5)}</span></div>${bars(5)}</div>
  <div class="sheet stack"><div class="row" style="justify-content:space-between"><b>Part 6</b><span class="muted" style="font-size:13px">전체 ${tot(6)} · 레벨 ${lvText(S.settings.lv6)}</span></div>${bars(6)}</div>
  <div class="sheet stack"><b>최근 14일 학습량</b>${active<3?`<div class="muted" style="font-size:13px">공부한 날이 ${active}일이라 아직 그래프가 의미 없어. 3일 이상 쌓이면 보여줄게.</div>`:`
    <div class="days" role="img" aria-label="최근 14일 단어와 문제 학습량">${days.map(d=>`<div title="${d.l}일 · 단어 ${d.w} · 문제 ${d.q}"><i style="height:${d.w/mx*100}%;background:var(--omr)"></i><i style="height:${d.q/mx*100}%;background:var(--mark)"></i></div>`).join('')}</div>
    <div class="daylbl">${days.map(d=>`<span class="${d.today?'today':''}">${d.l}</span>`).join('')}</div>
    <div class="legend"><span><i style="background:var(--omr)"></i>단어</span><span><i style="background:var(--mark)"></i>문제</span><span>최대 ${mx}</span></div>`}</div>
  <div class="sheet stack"><b>단어 상태</b><div class="grid3">
    <div class="tile"><div class="n">${nw}</div><div class="l">아직 안 본 단어</div></div>
    <div class="tile"><div class="n">${ln}</div><div class="l">학습 중</div></div>
    <div class="tile"><div class="n">${mt}</div><div class="l">장기 기억</div><div class="s">21일+</div></div></div>
    ${hard.length?`<div><div class="eyebrow" style="margin-bottom:6px">자주 틀리는 단어</div>${hard.map(([id,s])=>{const w=S.words.get(id);return`<div class="witem"><div class="line"><span><span class="w">${esc(w.w)}</span> <span class="k">${esc(w.ko)}</span></span><span class="chip">${s.lapses}회</span></div></div>`}).join('')}</div>`:''}
  </div></div>`;
  // 유형 막대나 맨 위 버튼을 누르면 그 유형만 5문제
  const practice=t=>{const ids=pick(5,5,t);if(!ids.length)return toast('그 유형 문제가 없어');location.hash='p5';startP5(false,ids)};
  V.querySelectorAll('.bar[data-t]').forEach(b=>{b.onclick=()=>practice(b.dataset.t);b.onkeydown=e=>{if(e.key==='Enter')practice(b.dataset.t)}});
  if(ws)sweak.onclick=()=>practice(weak5)}

/* ---------- 단어장 + 설정 ---------- */
let deckQ='',deckLv='',delArm=null,editId=null;
function slug(w){return(w.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'w')+'-'+Math.random().toString(36).slice(2,6)}
function addWord(o){const id=slug(o.w);const doc={w:o.w.trim(),pos:(o.pos||'').trim(),ko:o.ko.trim(),ex:(o.ex||'').trim(),lv:+o.lv||1,created:Date.now()};S.words.set(id,doc);return[id,doc]}
function rDeck(){const st={new:'새',learning:'학습 중',mature:'장기'};
  const list=[...S.words.entries()].filter(([,w])=>(!deckLv||String(w.lv||1)===deckLv)&&(!deckQ||(w.w+' '+w.ko).toLowerCase().includes(deckQ.toLowerCase())))
    .sort((a,b)=>a[1].w.localeCompare(b[1].w));
  V.innerHTML=`<div class="stack"><div><div class="eyebrow">데이터베이스 · words</div><h2>단어장</h2></div>
  <div class="sheet stack"><b>단어 추가</b>
    <form id="af" class="stack"><div class="row">
      <label class="f">단어<input id="aw" required placeholder="expedite" autocapitalize="off"></label>
      <label class="f">뜻<input id="ak" required placeholder="신속히 처리하다"></label></div>
      <details id="amore"${LS.get('omr.amore')?' open':''}><summary style="font-size:14px">품사 · 레벨 · 예문</summary><div class="stack" style="margin-top:4px">
      <div class="row"><label class="f" style="flex:0 1 90px">품사<input id="ap" placeholder="v" autocapitalize="off"></label>
      <label class="f" style="flex:0 1 110px">레벨<select id="al"><option value="1">1 기본</option><option value="2">2 중급</option><option value="3">3 고난도</option></select></label></div>
      <label class="f">예문<input id="ae" placeholder="We will expedite your order."></label></div></details>
      <div class="row"><button class="primary" type="submit">추가</button></div></form>
    <details><summary style="cursor:pointer;font-size:14px">여러 개 붙여넣기</summary>
      <div class="stack" style="margin-top:8px"><div class="muted" style="font-size:13px">한 줄에 하나씩: <code>단어 | 뜻 | 품사 | 레벨 | 예문</code> (품사 이후는 생략 가능). 탭으로 구분된 엑셀 복사도 돼.</div>
      <textarea id="bulk" placeholder="allocate | 할당하다 | v | 2 | The funds were allocated to marketing."></textarea>
      <div class="row"><button id="bulkgo">일괄 추가</button></div></div></details>
  </div>
  <div class="sheet stack"><div class="row" style="justify-content:space-between"><b>${list.length} / ${S.words.size}개</b></div>
    <div class="row"><input id="dq" placeholder="검색" value="${esc(deckQ)}" style="flex:1 1 160px" aria-label="단어 검색">
      <select id="dl" aria-label="레벨 필터"><option value="">전체 레벨</option>${[1,2,3].map(l=>`<option value="${l}" ${deckLv==l?'selected':''}>L${l}</option>`).join('')}</select></div>
    ${!list.length&&S.words.size?`<div class="line"><span class="muted">맞는 단어가 없어.</span><button class="sm" id="dclr">필터 지우기</button></div>`:''}
    <div class="wlist">${list.slice(0,300).map(([id,w])=>editId===id?`
      <div class="witem" style="grid-template-columns:minmax(0,1fr)"><div class="stack" style="gap:8px">
        <div class="row"><input id="ew" value="${esc(w.w)}" style="flex:1 1 120px" aria-label="단어"><input id="ek" value="${esc(w.ko)}" style="flex:1 1 140px" aria-label="뜻"></div>
        <div class="row"><input id="ep" value="${esc(w.pos)}" style="flex:0 1 70px" aria-label="품사"><select id="el" aria-label="레벨">${[1,2,3].map(l=>`<option ${w.lv==l?'selected':''}>${l}</option>`).join('')}</select>
        <input id="ee" value="${esc(w.ex)}" style="flex:1 1 180px" aria-label="예문"></div>
        <div class="row"><button class="sm primary" data-save="${esc(id)}">저장</button><button class="sm ghost" data-cancel>취소</button></div></div></div>`:`
      <div class="witem"><div style="min-width:0"><span class="w">${esc(w.w)}</span> <span class="pos">${esc(w.pos)}</span><div class="k">${esc(w.ko)}</div></div>
        <div class="acts"><span class="chip lv${w.lv||1}">L${w.lv||1}</span><span class="chip">${st[wordStatus(id)]}</span>
        <button class="sm ghost" data-edit="${esc(id)}" aria-label="${esc(w.w)} 수정">수정</button>
        <button class="sm ghost del${delArm===id?' arm':''}" data-del="${esc(id)}">${delArm===id?'삭제 확인':'삭제'}</button></div></div>`).join('')}
      ${list.length>300?'<div class="muted" style="padding:8px 0;font-size:13px">300개까지만 보여. 검색으로 좁혀줘.</div>':''}</div></div>
  <div class="sheet stack"><div class="eyebrow">설정</div>
    <div class="row"><label class="f" style="flex:0 1 180px">하루 새 단어 수<input id="dn" type="number" min="0" max="100" value="${S.settings.daily_new??15}"></label>
      <button id="dns" class="sm" style="align-self:flex-end">저장</button></div>
    <label class="f">Claude API 키 (이 기기에만 저장)<input id="ck" type="password" placeholder="sk-ant-..." value="${esc(CFG.claudeKey||'')}" autocomplete="off"></label>
    <label class="f">문제 생성 모델<select id="cm">${MODELS.map(([v,l])=>`<option value="${v}" ${(CFG.model||MODELS[0][0])===v?'selected':''}>${l}</option>`).join('')}</select></label>
    <div class="row"><button id="cks" class="sm">API 설정 저장</button></div>
    <div class="muted" style="font-size:12px">Supabase: ${esc(CFG.url||'')} · ${esc(CFG.email||'')}</div>
    <div class="row"><button id="lo" class="sm ghost">로그아웃</button></div>
  </div></div>`;
  af.onsubmit=e=>{e.preventDefault();const[id,doc]=addWord({w:aw.value,ko:ak.value,pos:ap.value,lv:al.value,ex:ae.value});upsert('words',id,doc);toast(doc.w+' 추가');rDeck();document.getElementById('aw').focus()};
  bulkgo.onclick=async()=>{const rows=[];for(const line of bulk.value.split('\n')){const p=line.split(/\s*[|\t]\s*/);if(p.length<2||!p[0].trim()||!p[1].trim())continue;
      const lv=/^[123]$/.test(p[3]||'')?p[3]:1;const[id,doc]=addWord({w:p[0],ko:p[1],pos:p[2]||'',lv,ex:p[4]||''});rows.push({id,...doc})}
    if(!rows.length)return toast('추가할 줄이 없어. 형식을 확인해줘');
    for(const r of rows){const{id,...doc}=r;upsert('words',id,doc)}toast(rows.length+'개 추가했어');rDeck()};
  dns.onclick=()=>{S.settings.daily_new=clamp(parseInt(dn.value)||0,0,100);saveSettings();toast('하루 새 단어 '+S.settings.daily_new+'개')};
  cks.onclick=()=>{CFG={...CFG,claudeKey:ck.value.trim(),model:cm.value};LS.set('omr.cfg',CFG);toast('API 설정을 저장했어')};
  lo.onclick=async()=>{await flush();if(OUT.length)return toast('아직 못 보낸 기록이 '+OUT.length+'개 있어. 연결된 뒤에 로그아웃해줘');TOK=null;LS.del('omr.tok');S.ready=false;render()};
  dq.oninput=()=>{deckQ=dq.value;const pos=dq.selectionStart;rDeck();const n=document.getElementById('dq');n.focus();n.setSelectionRange(pos,pos)};
  dl.onchange=()=>{deckLv=dl.value;rDeck()};
  amore.ontoggle=()=>LS.set('omr.amore',amore.open);
  if(document.getElementById('dclr'))dclr.onclick=()=>{deckQ='';deckLv='';rDeck()};
  V.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const id=b.dataset.del;if(delArm!==id){delArm=id;rDeck();return}
    delArm=null;S.words.delete(id);S.srs.delete(id);remove('words',id);remove('srs',id);toast('삭제했어');rDeck()});
  V.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editId=b.dataset.edit;delArm=null;rDeck()});
  V.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>{editId=null;rDeck()});
  V.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{const id=b.dataset.save;const old=S.words.get(id);if(!ew.value.trim()||!ek.value.trim())return toast('단어와 뜻은 비울 수 없어');
    const doc={...clone(old),w:ew.value.trim(),ko:ek.value.trim(),pos:ep.value.trim(),lv:+el.value,ex:ee.value.trim()};S.words.set(id,doc);upsert('words',id,doc);editId=null;toast('저장했어');rDeck()});
}

/* ---------- 시작 ---------- */
// 문제 생성 중(genCtl)에는 화면을 다시 그리지 않는다. 다시 그리면 진행 표시가 사라지고 버튼이 다시 켜진다.
async function refresh(force){if(!TOK||S.session||genCtl)return;const typing=/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||'');await flush();try{await loadAll();if(force)toast('최신 기록을 불러왔어');if(!typing)render()}catch(e){if(e.code==='auth'){render()}else{syncLabel();if(force)toast(errText(e))}}}
async function start(){if(!CFG.url||!TOK)return render();try{await loadAll();flush()}catch(e){if(e.code==='auth')return render();
  if(loadSnap()){render();clearTimeout(flushT);flushT=setTimeout(flush,20000);return}
  setSync('불러오기 실패');V.innerHTML=`<div class="note">데이터를 불러오지 못했어${e.code?' ('+esc(e.code)+')':''}. ${esc(String(e.message||'').slice(0,120))}<br><button class="sm" onclick="start()">다시 시도</button></div>`;return}render()}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refresh(false)});  // 잠금화면 퀴즈 기록 반영
// /preview/ 에 올린 시험판은 표시만 다르다 (같은 로그인·같은 DB)
if(/\/preview\//.test(location.pathname)){document.title='OMR 토익 미리보기';document.querySelector('.brand').firstChild.textContent='미리보기 판 · 실제 기록에 저장돼'}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
go();start();
</script>
