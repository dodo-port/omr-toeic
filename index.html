<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OMR 토익</title>
<meta name="theme-color" content="#fbfaf7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OMR 토익">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;500;700&family=Newsreader:opsz,wght@6..72,500;6..72,700&display=swap">
<style>
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: OMR 답안지 — 위쪽 타이밍 마크 띠, 가운데 단일 컬럼, 아래 고정 탭바 */
:root{
  --paper:#fbfaf7; --sheet:#ffffff; --ink:#1d1f24; --muted:#6c6567;
  --omr:#c23b5a; --omr-soft:#f8e3e8; --line:#ecd9de; --mark:#23262d;
  --good:#157a4a; --good-soft:#e1f2e8; --bad:#b42318; --bad-soft:#fbe4e1;
  --f-word:"Newsreader",Georgia,"Times New Roman",serif;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#15161a; --sheet:#1d1e23; --ink:#ecebe8; --muted:#a39a9d;
  --omr:#ee7a95; --omr-soft:#3b232b; --line:#3a2c32; --mark:#ecebe8;
  --good:#5cc98f; --good-soft:#173527; --bad:#f2877a; --bad-soft:#3d1f1b; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#15161a; --sheet:#1d1e23; --ink:#ecebe8; --muted:#a39a9d;
  --omr:#ee7a95; --omr-soft:#3b232b; --line:#3a2c32; --mark:#ecebe8;
  --good:#5cc98f; --good-soft:#173527; --bad:#f2877a; --bad-soft:#3d1f1b; color-scheme:dark}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:680px;margin:0 auto}
header.top{padding-block:14px 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;
  border-bottom:2px solid var(--omr);position:relative}
header.top::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;
  background:repeating-linear-gradient(90deg,var(--mark) 0 10px,transparent 10px 22px);opacity:.85}
.brand{font-family:var(--f-mono);font-weight:600;letter-spacing:.08em;font-size:13px;color:var(--omr);padding-top:10px}
.brand b{color:var(--ink);font-family:var(--f-ui);font-size:20px;letter-spacing:0;display:block;font-weight:700}
.sync{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:right}
main{padding-block:18px}
h2{font-size:18px;margin:0;text-wrap:balance}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--omr)}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{border-left:3px solid var(--omr);padding:4px 0 4px 10px}
.tile .n{font-family:var(--f-mono);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.tile .l{font-size:12px;color:var(--muted)}
button,.btn{font:inherit;font-weight:500;border-radius:6px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);
  padding:10px 14px;cursor:pointer;min-height:42px}
button:hover{border-color:var(--omr)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--omr);outline-offset:2px}
button.primary{background:var(--mark);color:var(--paper);border-color:var(--mark)}
button.ghost{background:transparent}
button:disabled{opacity:.45;cursor:not-allowed}
button.sm{padding:6px 10px;min-height:32px;font-size:13px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:9px 10px;min-width:0}
textarea{width:100%;min-height:110px;resize:vertical;font-family:var(--f-mono);font-size:13px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);flex:1 1 140px;min-width:0}
.stack>label.f{flex:none}
.chip{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-mono);font-size:11px;padding:2px 8px;border-radius:99px;
  border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.lv1{border-color:var(--good);color:var(--good)}
.chip.lv2{border-color:var(--omr);color:var(--omr)}
.chip.lv3{background:var(--omr);border-color:var(--omr);color:var(--sheet)}
.progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--omr);transition:width .25s}
/* Word card */
.word{font-family:var(--f-word);font-size:clamp(34px,9vw,48px);font-weight:700;line-height:1.1;letter-spacing:-.01em;word-break:break-word}
.pos{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.ko{font-size:20px;font-weight:700}
.ex{font-family:var(--f-word);font-size:17px;border-left:2px solid var(--line);padding-left:10px}
.grades{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.grades button{display:flex;flex-direction:column;align-items:center;gap:0;padding:8px 4px}
.grades small{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
/* OMR choices */
.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:var(--sheet)}
.bub{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--omr);color:var(--omr);display:grid;place-items:center;
  font-family:var(--f-mono);font-size:12px;font-weight:600}
.choice .t{min-width:0;overflow-wrap:anywhere}
.choice.sel .bub{background:var(--mark);border-color:var(--mark);color:var(--sheet)}
.choice.ok{border-color:var(--good);background:var(--good-soft)}
.choice.ok .bub{background:var(--good);border-color:var(--good);color:var(--sheet)}
.choice.no{border-color:var(--bad);background:var(--bad-soft)}
.choice.no .bub{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.stem{font-family:var(--f-word);font-size:19px;line-height:1.5}
.blank{display:inline-block;min-width:70px;border-bottom:2px solid var(--omr);color:var(--omr);font-family:var(--f-mono);font-size:13px;text-align:center}
.passage{font-family:var(--f-word);font-size:17px;line-height:1.65;white-space:pre-wrap}
.exp{border-radius:6px;padding:10px 12px;font-size:14px}
.exp.ok{background:var(--good-soft)} .exp.no{background:var(--bad-soft)}
/* stats */
.bar{display:grid;grid-template-columns:110px minmax(0,1fr) 72px;gap:8px;align-items:center;font-size:13px}
.bar .track{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.bar .track i{display:block;height:100%}
.bar .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;font-size:12px}
.days{display:flex;gap:4px;align-items:flex-end;height:110px;border-bottom:1px solid var(--line)}
.days>div{flex:1;display:flex;flex-direction:column-reverse;gap:1px;height:100%;justify-content:flex-start}
.days i{display:block;width:100%;border-radius:2px 2px 0 0}
.daylbl{display:flex;gap:4px;font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.daylbl span{flex:1;text-align:center}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
/* deck list */
.wlist{display:flex;flex-direction:column}
.witem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.witem .w{font-family:var(--f-word);font-size:18px;font-weight:700}
.witem .k{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.witem .acts{display:flex;gap:6px}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--sheet);border-top:2px solid var(--omr);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px}
nav.tabs a{color:var(--muted);text-decoration:none;text-align:center;padding:6px 0;border-radius:6px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs a .m{font-family:var(--f-mono);font-size:15px;font-weight:600}
nav.tabs a[aria-current="page"]{color:var(--omr);background:var(--omr-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--mark);color:var(--paper);
  padding:9px 14px;border-radius:6px;font-size:13px;z-index:9;max-width:calc(100% - 32px)}
.note{font-size:13px;padding:10px 12px;border:1px dashed var(--omr);border-radius:6px;color:var(--ink)}
.gen-out{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:pre-wrap;max-height:120px;overflow:auto}
@media (max-width:420px){.bar{grid-template-columns:84px minmax(0,1fr) 64px}.grid3{gap:6px}.tile .n{font-size:22px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.setup{max-width:460px}
.setup .f input{width:100%}
code{font-family:var(--f-mono);font-size:12px;background:var(--omr-soft);padding:1px 4px;border-radius:3px}
.err{color:var(--bad);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">TOEIC · 개인 학습 답안지<b>OMR 토익</b></div>
    <div class="sync" id="sync">준비 중…</div>
  </header>
  <main id="view" aria-live="polite"></main>
</div>
<nav class="tabs" aria-label="메뉴"><div class="in">
  <a href="#home" data-v="home"><span class="m">●</span>홈</a>
  <a href="#words" data-v="words"><span class="m">Aa</span>단어</a>
  <a href="#p5" data-v="p5"><span class="m">P5</span>문법·어휘</a>
  <a href="#p6" data-v="p6"><span class="m">P6</span>장문</a>
  <a href="#stats" data-v="stats"><span class="m">%</span>분석</a>
  <a href="#deck" data-v="deck"><span class="m">≡</span>단어장</a>
</div></nav>
<div class="toast" id="toast" hidden></div>

<script>
/* =========================================================
   OMR 토익 — 개인용 TOEIC 학습 PWA
   저장소: Supabase (REST, 본인 계정 RLS)   생성: Claude API (본인 키)
   잠금화면 위젯(scriptable/)과 같은 테이블을 공유한다.
   ========================================================= */
const DAY=86400000;
const TYPES5=['품사','동사 형태·시제','수일치·태','대명사','전치사','접속사·접속부사','관계사','비교','특수구문','어휘'];
const TYPES6=[...TYPES5,'문장삽입'];
const LVNAME={1:'기본 · 600점대',2:'중급 · 700~800점대',3:'고난도 · 850점+'};
const LET=['A','B','C','D'];
const MODELS=[['claude-sonnet-5-5','Sonnet 5.5 · 기본'],['claude-haiku-5-5','Haiku 5.5 · 빠르고 저렴'],['claude-opus-5-5','Opus 5.5 · 최고 품질']];
const DEFAULT_SETTINGS={lv5:1.5,lv6:1.5,daily_new:15};
const S={words:new Map(),srs:new Map(),qs:new Map(),days:new Map(),settings:{...DEFAULT_SETTINGS},
  ready:false,view:'home',session:null};
const V=document.getElementById('view');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayId=(t=new Date())=>t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const clone=o=>JSON.parse(JSON.stringify(o||{}));
let toastT;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}
function setSync(m){document.getElementById('sync').textContent=m}

/* ---------- 로컬 설정 (이 기기에만 저장) ---------- */
const LS={get(k){try{return JSON.parse(localStorage.getItem(k))}catch{return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}},del(k){try{localStorage.removeItem(k)}catch{}}};
let CFG=LS.get('omr.cfg')||{};      // {url, anon, email, claudeKey, model}
let TOK=LS.get('omr.tok')||null;    // {access, refresh, exp, uid}

/* ---------- Supabase REST ---------- */
async function authReq(grant,body){
  const r=await fetch(CFG.url+'/auth/v1/token?grant_type='+grant,{method:'POST',headers:{apikey:CFG.anon,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok||!j.access_token)throw{code:'auth',message:j.error_description||j.msg||j.message||('로그인 실패 ('+r.status+')')};
  TOK={access:j.access_token,refresh:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1000,uid:j.user.id};LS.set('omr.tok',TOK)}
let refreshing=null;
async function token(){if(!TOK)throw{code:'auth',message:'로그인이 필요해'};
  if(Date.now()>TOK.exp-60000){refreshing=refreshing||authReq('refresh_token',{refresh_token:TOK.refresh}).finally(()=>refreshing=null);
    try{await refreshing}catch(e){TOK=null;LS.del('omr.tok');throw e}}
  return TOK.access}
async function rest(path,{method='GET',body,prefer}={}){
  const h={apikey:CFG.anon,Authorization:'Bearer '+await token(),'Content-Type':'application/json'};if(prefer)h.Prefer=prefer;
  const r=await fetch(CFG.url+'/rest/v1/'+path,{method,headers:h,body:body===undefined?undefined:JSON.stringify(body)});
  const txt=await r.text();if(!r.ok){let m=txt;try{m=JSON.parse(txt).message||txt}catch{}throw{code:r.status,message:m}}
  return txt?JSON.parse(txt):null}
async function selectAll(table){let out=[];for(let from=0;;from+=1000){const rows=await rest(`${table}?select=*&limit=1000&offset=${from}`);out=out.concat(rows);if(rows.length<1000)return out}}
const KEYS={words:'id',srs:'word_id',questions:'id',days:'date'};
function strip(r){const o={...r};delete o.user_id;return o}
const chains={};
function errText(e){if(e&&e.code==='auth')return'로그인이 만료됐어. 다시 로그인해줘.';if(!navigator.onLine)return'오프라인이라 저장하지 못했어. 연결되면 다시 해줘.';return'저장하지 못했어 ('+(e&&e.code||'오류')+'). '+String(e&&e.message||'').slice(0,80)}
function queue(key,fn){chains[key]=(chains[key]||Promise.resolve()).then(fn).catch(e=>{console.warn(e);toast(errText(e));if(e&&e.code==='auth')render()});return chains[key]}
function upsert(table,id,obj){const kc=table==='settings'?null:KEYS[table];const row={...obj,user_id:TOK.uid};if(kc)row[kc]=id;
  return queue(table+'/'+id,()=>rest(`${table}?on_conflict=${kc?'user_id,'+kc:'user_id'}`,{method:'POST',body:[row],prefer:'resolution=merge-duplicates,return=minimal'}))}
function remove(table,id){return queue(table+'/'+id,()=>rest(`${table}?${KEYS[table]}=eq.${encodeURIComponent(id)}`,{method:'DELETE'}))}
async function upsertMany(table,rows){const kc=KEYS[table];for(let i=0;i<rows.length;i+=200){
  await rest(`${table}?on_conflict=user_id,${kc}`,{method:'POST',body:rows.slice(i,i+200).map(r=>({...r,user_id:TOK.uid})),prefer:'resolution=merge-duplicates,return=minimal'})}}

async function loadAll(){setSync('불러오는 중…');
  const [w,s,q,d,st]=await Promise.all(['words','srs','questions','days','settings'].map(selectAll));
  S.words=new Map(w.map(r=>[r.id,strip(r)]));S.srs=new Map(s.map(r=>[r.word_id,strip(r)]));
  S.qs=new Map(q.map(r=>[r.id,strip(r)]));S.days=new Map(d.map(r=>[r.date,strip(r)]));
  S.settings={...DEFAULT_SETTINGS,...(st[0]?strip(st[0]):{})};S.ready=true;
  setSync('동기화 '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}))}
function setDay(id,d){upsert('days',id,d)}
function bumpDay(fn){const id=todayId();const d=clone(S.days.get(id)||{words_reviewed:0,words_new:0,words_again:0,q:{}});d.q=d.q||{};fn(d);S.days.set(id,d);setDay(id,d)}
function saveSettings(){upsert('settings','main',S.settings)}

/* ---------- SRS (SM-2) — scriptable/ 위젯과 같은 규칙 ---------- */
function nextOf(s,q){s={ef:2.5,reps:0,ivl:0,lapses:0,...(s||{})};const now=Date.now();
  if(q<3){s.reps=0;s.ivl=0;s.lapses=(s.lapses||0)+1;s.due=now+10*60000}
  else{s.reps++;s.ivl=s.reps===1?1:s.reps===2?3:Math.round(s.ivl*s.ef);if(q===5)s.ivl=Math.max(2,Math.round(s.ivl*1.3));
    s.ef=Math.max(1.3,s.ef+0.1-(5-q)*(0.08+(5-q)*0.02));s.due=now+s.ivl*DAY}
  s.last=now;return s}
function ivLabel(s,q){const n=nextOf(s,q);return n.ivl===0?'10분':n.ivl+'일'}
function gradeWord(id,q){const isNew=!S.srs.has(id);const s=nextOf(S.srs.get(id),q);S.srs.set(id,s);upsert('srs',id,s);
  bumpDay(d=>{d.words_reviewed++;if(isNew)d.words_new++;if(q<3)d.words_again++})}
function buildQueue(){const now=Date.now();
  const due=[...S.srs.entries()].filter(([id,s])=>s.due<=now&&S.words.has(id)).sort((a,b)=>a[1].due-b[1].due).map(x=>x[0]);
  const left=Math.max(0,(S.settings.daily_new??15)-((S.days.get(todayId())||{}).words_new||0));
  const fresh=[...S.words.entries()].filter(([id])=>!S.srs.has(id))
    .sort((a,b)=>(a[1].lv||1)-(b[1].lv||1)||(a[1].created||0)-(b[1].created||0)).slice(0,left).map(x=>x[0]);
  return{due,fresh,left}}
function wordStatus(id){const s=S.srs.get(id);if(!s)return'new';return s.ivl>=21?'mature':'learning'}

/* ---------- 통계 ---------- */
function typeStats(part){const agg={};for(const d of S.days.values()){for(const[k,v]of Object.entries(d.q||{})){const[p,t]=k.split(':');if(+p!==part)continue;
  agg[t]=agg[t]||{n:0,c:0};agg[t].n+=v.n;agg[t].c+=v.c}}return agg}
function weakTypes(part){return Object.entries(typeStats(part)).filter(([,v])=>v.n>=3).sort((a,b)=>a[1].c/a[1].n-b[1].c/b[1].n).slice(0,3).map(x=>x[0])}
function streak(){let n=0;const t=new Date();for(let i=0;i<400;i++){const d=S.days.get(todayId(new Date(t.getTime()-i*DAY)));
  const act=d&&(d.words_reviewed||Object.values(d.q||{}).some(v=>v.n));if(act)n++;else if(i>0)break}return n}
function lvText(x){return x.toFixed(1)+' · '+LVNAME[Math.round(x)].split(' · ')[0]}

/* ---------- 라우팅 ---------- */
const VIEWS=['home','words','p5','p6','stats','deck'];
function go(){const h=location.hash.slice(1);const v=VIEWS.includes(h)?h:'home';if(S.session&&S.session.view!==v)S.session=null;S.view=v;
  document.querySelectorAll('nav.tabs a').forEach(a=>a.dataset.v===v?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));render()}
window.addEventListener('hashchange',go);
function render(){if(!CFG.url||!CFG.anon||!TOK)return rSetup();if(!S.ready){V.innerHTML='<div class="muted">불러오는 중…</div>';return}
  ({home:rHome,words:rWords,p5:()=>rQuiz(5),p6:()=>rQuiz(6),stats:rStats,deck:rDeck})[S.view]()}

/* ---------- 첫 설정 · 로그인 ---------- */
function rSetup(err){
  V.innerHTML=`<div class="stack setup"><div><div class="eyebrow">처음 한 번만</div><h2>내 Supabase에 연결</h2></div>
  <div class="muted" style="font-size:14px">README의 1~2단계에서 만든 프로젝트 주소와 키, 계정을 넣어줘. 이 기기에만 저장돼.</div>
  <form id="sf" class="sheet stack">
    <label class="f">Project URL<input id="su" required placeholder="https://xxxx.supabase.co" value="${esc(CFG.url||'')}" autocomplete="off"></label>
    <label class="f">anon(public) 또는 publishable 키<input id="sk" required value="${esc(CFG.anon||'')}" autocomplete="off"></label>
    <label class="f">이메일<input id="se" type="email" required value="${esc(CFG.email||'')}" autocomplete="username"></label>
    <label class="f">비밀번호<input id="sp" type="password" required autocomplete="current-password"></label>
    ${err?`<div class="err">${esc(err)}</div>`:''}
    <div class="row"><button class="primary" type="submit" id="sgo">연결하고 로그인</button></div>
  </form></div>`;
  sf.onsubmit=async e=>{e.preventDefault();sgo.disabled=true;sgo.textContent='연결 중…';
    CFG={...CFG,url:su.value.trim().replace(/\/+$/,''),anon:sk.value.trim(),email:se.value.trim()};LS.set('omr.cfg',CFG);
    try{await authReq('password',{email:CFG.email,password:sp.value});await start()}catch(x){rSetup(x.message||'연결 실패. 주소와 키를 확인해줘.')}}}

/* ---------- 홈 ---------- */
function rHome(){const q=buildQueue();const d=S.days.get(todayId())||{};let qn=0,qc=0;for(const v of Object.values(d.q||{})){qn+=v.n;qc+=v.c}
  const empty=S.words.size===0&&S.qs.size===0;
  V.innerHTML=`<div class="stack">
  <div><div class="eyebrow">${esc(new Date().toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'short'}))}</div><h2>오늘 할 일</h2></div>
  ${empty?`<div class="sheet stack"><b>DB가 비어 있어</b><div class="muted" style="font-size:14px">기본 단어 60개와 Part 5·6 문제 21개를 내 DB에 넣을게. 내 단어장은 나중에 단어장 탭에서 추가하면 돼.</div>
    <div class="row"><button class="primary" id="hseed">기본 단어·문제 불러오기</button></div></div>`:''}
  <div class="sheet stack">
    <div class="grid3">
      <div class="tile"><div class="n">${q.due.length}</div><div class="l">복습할 단어</div></div>
      <div class="tile"><div class="n">${q.fresh.length}</div><div class="l">오늘 새 단어</div></div>
      <div class="tile"><div class="n">${streak()}</div><div class="l">연속 학습일</div></div>
    </div>
    <div class="row"><button class="primary" id="hw" ${q.due.length+q.fresh.length?'':'disabled'}>단어 학습 시작</button>
    <button id="hp5">Part 5 풀기</button><button id="hp6">Part 6 풀기</button></div>
  </div>
  <div class="sheet stack">
    <div class="eyebrow">오늘 기록 · 잠금화면 퀴즈 포함</div>
    <div class="grid3">
      <div class="tile"><div class="n">${d.words_reviewed||0}</div><div class="l">단어 학습</div></div>
      <div class="tile"><div class="n">${qn}</div><div class="l">문제 풀이</div></div>
      <div class="tile"><div class="n">${qn?Math.round(qc/qn*100)+'%':'–'}</div><div class="l">정답률</div></div>
    </div>
    <div class="muted" style="font-size:13px">Part 5 레벨 ${lvText(S.settings.lv5)} · Part 6 레벨 ${lvText(S.settings.lv6)}</div>
    <div class="row"><button class="sm ghost" id="hsync">새로고침</button></div>
  </div></div>`;
  hw.onclick=()=>{location.hash='words'};hp5.onclick=()=>{location.hash='p5'};hp6.onclick=()=>{location.hash='p6'};
  hsync.onclick=()=>refresh(true);
  if(empty)hseed.onclick=async()=>{hseed.disabled=true;hseed.textContent='넣는 중…';
    try{const seed=await (await fetch('data/seed.json')).json();await upsertMany('words',seed.words);await upsertMany('questions',seed.questions);
      if(!S.days.size)saveSettings();await loadAll();toast('기본 데이터를 넣었어');render()}
    catch(e){toast(errText(e));hseed.disabled=false;hseed.textContent='다시 시도'}}}

/* ---------- 단어 학습 ---------- */
function rWords(){
  if(!S.session||S.session.view!=='words'){const q=buildQueue();
    V.innerHTML=`<div class="stack"><div><div class="eyebrow">간격 반복 · SM-2</div><h2>단어 학습</h2></div>
    <div class="sheet stack"><div class="grid3">
      <div class="tile"><div class="n">${q.due.length}</div><div class="l">복습 예정</div></div>
      <div class="tile"><div class="n">${q.fresh.length}</div><div class="l">새 단어 (남은 한도 ${q.left})</div></div>
      <div class="tile"><div class="n">${S.words.size}</div><div class="l">전체 단어</div></div></div>
      <div class="row"><button class="primary" id="ws1" ${q.due.length+q.fresh.length?'':'disabled'}>카드로 학습</button>
      <button id="ws2" ${q.due.length+q.fresh.length?'':'disabled'}>4지선다 퀴즈</button></div>
      ${q.due.length+q.fresh.length?'':'<div class="muted" style="font-size:14px">오늘 분량을 다 끝냈어. 새 단어 한도는 단어장 탭에서 바꿀 수 있어.</div>'}
    </div>
    <div class="muted" style="font-size:13px">카드: 뜻을 떠올린 뒤 스스로 채점해. 퀴즈: 틀리면 10분 뒤 다시 나오고, 이번 세션 끝에 한 번 더 나와. 잠금화면 위젯도 같은 일정을 써.</div></div>`;
    ws1.onclick=()=>startWords('card');ws2.onclick=()=>startWords('quiz');return}
  const s=S.session;if(s.i>=s.list.length){finishWords();return}
  const id=s.list[s.i];const w=S.words.get(id);if(!w){s.i++;return rWords()}
  const pct=Math.round(s.i/s.list.length*100);const srs=S.srs.get(id);
  const head=`<div class="row" style="justify-content:space-between"><span class="eyebrow">${s.i+1} / ${s.list.length}</span>
    <span class="row" style="gap:6px">${srs?'<span class="chip">복습</span>':'<span class="chip">새 단어</span>'}<span class="chip lv${w.lv||1}">L${w.lv||1}</span>
    <button class="sm ghost" id="wq">그만하기</button></span></div><div class="progress"><i style="width:${pct}%"></i></div>`;
  if(s.mode==='card'){
    V.innerHTML=`<div class="stack">${head}<div class="sheet stack" style="min-height:260px">
      <div><div class="word">${esc(w.w)}</div><div class="pos">${esc(w.pos||'')}</div></div>
      <div class="stack" ${s.shown?'':'hidden'}><div class="ko">${esc(w.ko)}</div>${w.ex?`<div class="ex">${esc(w.ex)}</div>`:''}</div>
    </div>
    ${s.shown?`<div class="grades">
      <button data-g="1">모름<small>${ivLabel(srs,1)}</small></button><button data-g="3">헷갈림<small>${ivLabel(srs,3)}</small></button>
      <button data-g="4">알아<small>${ivLabel(srs,4)}</small></button><button data-g="5">쉬움<small>${ivLabel(srs,5)}</small></button></div>`
      :`<button class="primary" id="wshow">뜻 보기</button>`}</div>`;
    if(!s.shown)wshow.onclick=()=>{s.shown=true;rWords()};
    V.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>answerCard(+b.dataset.g));
  }else{
    if(!s.opts){const others=shuffle([...S.words.entries()].filter(([k,o])=>k!==id&&o.ko!==w.ko)).sort((a,b)=>((b[1].pos===w.pos)-(a[1].pos===w.pos))).slice(0,3).map(x=>x[1].ko);
      s.opts=shuffle([w.ko,...others]);s.picked=null}
    const done=s.picked!=null;
    V.innerHTML=`<div class="stack">${head}<div class="sheet stack">
      <div><div class="word">${esc(w.w)}</div><div class="pos">${esc(w.pos||'')}</div></div>
      <div class="choices">${s.opts.map((o,i)=>{const cls=done?(o===w.ko?'ok':i===s.picked?'no':''):'';
        return`<button class="choice ${cls}" data-i="${i}" ${done?'disabled':''}><span class="bub">${i+1}</span><span class="t">${esc(o)}</span></button>`}).join('')}</div>
      ${done&&w.ex?`<div class="ex">${esc(w.ex)}</div>`:''}</div>
      ${done?`<button class="primary" id="wnext">다음</button>`:''}</div>`;
    V.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answerQuiz(+b.dataset.i));
    if(done)wnext.onclick=nextWord}
  wq.onclick=()=>finishWords()}
function startWords(mode){const q=buildQueue();S.session={view:'words',mode,list:[...q.due,...q.fresh],i:0,again:new Set(),stats:{n:0,ok:0}};rWords()}
function answerCard(g){const s=S.session;const id=s.list[s.i];gradeWord(id,g);s.stats.n++;if(g>=3)s.stats.ok++;
  if(g<3&&!s.again.has(id)){s.again.add(id);s.list.push(id)}s.i++;s.shown=false;rWords()}
function answerQuiz(i){const s=S.session;if(s.picked!=null)return;const id=s.list[s.i];const ok=s.opts[i]===S.words.get(id).ko;s.picked=i;
  gradeWord(id,ok?4:1);s.stats.n++;if(ok)s.stats.ok++;if(!ok&&!s.again.has(id)){s.again.add(id);s.list.push(id)}rWords()}
function nextWord(){const s=S.session;s.i++;s.opts=null;s.picked=null;rWords()}
function finishWords(){const st=S.session.stats;S.session=null;
  V.innerHTML=`<div class="stack"><div><div class="eyebrow">세션 완료</div><h2>${st.n}개 학습 · 정답 ${st.ok}개</h2></div>
  <div class="row"><button class="primary" id="fw1">단어 학습으로</button><button id="fw2">Part 5 풀기</button></div></div>`;
  fw1.onclick=()=>rWords();fw2.onclick=()=>location.hash='p5'}
document.addEventListener('keydown',e=>{const s=S.session;if(!s||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  if(s.view==='words'){if(s.mode==='card'){if(!s.shown&&(e.key===' '||e.key==='Enter')){e.preventDefault();s.shown=true;rWords()}
      else if(s.shown&&'1234'.includes(e.key)&&e.key.length===1){answerCard([1,3,4,5][+e.key-1])}}
    else{if(s.picked==null&&'1234'.includes(e.key)&&e.key.length===1)answerQuiz(+e.key-1);else if(s.picked!=null&&e.key==='Enter')nextWord()}}
  else if(s.view==='p5'&&s.picked==null&&e.key.length===1&&'abcdABCD1234'.includes(e.key)){const i='abcd'.indexOf(e.key.toLowerCase());answerP5(i>=0?i:+e.key-1)}
  else if(s.view==='p5'&&s.picked!=null&&e.key==='Enter'){nextP5()}});

/* ---------- Part 5 / 6 ---------- */
function pool(part){return[...S.qs.entries()].filter(([,q])=>q.part===part)}
function pick(part,n){const lv=Math.round(S.settings['lv'+part]);
  return pool(part).map(([id,q])=>[id,Math.abs((q.level||1)-lv)*10+(q.seen?(q.last_ok?6:2):0)+Math.random()*2]).sort((a,b)=>a[1]-b[1]).slice(0,n).map(x=>x[0])}
function unseenAt(part){const lv=Math.round(S.settings['lv'+part]);return pool(part).filter(([,q])=>!q.seen&&(q.level||1)===lv).length}
function adjustLv(part,q,ok){const k='lv'+part;const lv=S.settings[k];S.settings[k]=clamp(lv+(ok?((q.level||1)>=Math.round(lv)?0.12:0.05):-0.15),1,3)}
function recordQ(id,q,results){const wrong=results.filter(r=>!r.ok).length;
  const nq={...clone(q),seen:(q.seen||0)+1,wrong:(q.wrong||0)+(wrong?1:0),last_ok:!wrong,last_at:Date.now()};
  S.qs.set(id,nq);upsert('questions',id,nq);
  bumpDay(d=>{for(const r of results){const key=q.part+':'+r.type;d.q[key]=d.q[key]||{n:0,c:0};d.q[key].n++;if(r.ok)d.q[key].c++}})}

function rQuiz(part){
  if(S.session&&S.session.view==='p'+part){return part===5?rP5():rP6()}
  const n=pool(part).length;const un=unseenAt(part);const lv=S.settings['lv'+part];const weak=weakTypes(part);
  V.innerHTML=`<div class="stack">
  <div><div class="eyebrow">${part===5?'Part 5 · 단문 빈칸':'Part 6 · 장문 빈칸'}</div><h2>${part===5?'문법·어휘 문제':'장문 빈칸 채우기'}</h2></div>
  <div class="sheet stack">
    <div class="grid3">
      <div class="tile"><div class="n">${lv.toFixed(1)}</div><div class="l">내 레벨 (1~3)</div></div>
      <div class="tile"><div class="n">${un}</div><div class="l">현재 레벨 새 ${part===5?'문제':'지문'}</div></div>
      <div class="tile"><div class="n">${n}</div><div class="l">보유 ${part===5?'문제':'지문'}</div></div></div>
    <div class="muted" style="font-size:13px">지금 난이도: <b style="color:var(--ink)">${LVNAME[Math.round(lv)]}</b>. 맞히면 레벨이 오르고 틀리면 내려가서 다음 출제에 반영돼.</div>
    <div class="row"><button class="primary" id="qs" ${n?'':'disabled'}>${part===5?'10문제 풀기':'지문 1개 풀기'}</button>
      <select id="qlv" aria-label="레벨 직접 설정"><option value="">레벨 직접 설정</option><option value="1">1 · 기본</option><option value="2">2 · 중급</option><option value="3">3 · 고난도</option></select></div>
  </div>
  <div class="sheet stack">
    <div class="eyebrow">Claude로 새 문제 만들기</div>
    <div class="muted" style="font-size:13px">현재 레벨에 맞는 새 ${part===5?'문제 8개':'지문 1개(빈칸 4개)'}를 만들어 DB에 저장해. ${weak.length?'약점 유형 <b style="color:var(--ink)">'+weak.map(esc).join(', ')+'</b> 위주로 출제해.':'풀이 기록이 쌓이면 약점 유형 위주로 출제해.'}</div>
    <div class="row"><button id="qg">${part===5?'Part 5 문제 생성':'Part 6 지문 생성'}</button><button id="qstop" class="ghost" hidden>중지</button></div>
    <div class="gen-out" id="qgo" hidden></div>
  </div></div>`;
  qs.onclick=()=>part===5?startP5():startP6();
  qlv.onchange=()=>{if(!qlv.value)return;S.settings['lv'+part]=+qlv.value;saveSettings();toast('레벨을 '+qlv.value+'로 바꿨어');rQuiz(part)};
  qg.onclick=()=>generate(part);
  if(!CFG.claudeKey){qg.disabled=true;qgo.hidden=false;qgo.innerHTML='Claude API 키가 없어. <a href="#deck">단어장 탭 아래 설정</a>에서 넣어줘.'}}

function startP5(){const ids=pick(5,10);if(!ids.length)return;S.session={view:'p5',list:ids,i:0,picked:null,ok:0};rP5()}
function rP5(){const s=S.session;if(s.i>=s.list.length)return finishQ(5);const id=s.list[s.i];const q=S.qs.get(id);if(!q){s.i++;return rP5()}
  const done=s.picked!=null;const ok=done&&s.picked===q.answer;
  const stem=esc(q.stem).replace(/-{3,}/,'<span class="blank">______</span>');
  V.innerHTML=`<div class="stack"><div class="row" style="justify-content:space-between"><span class="eyebrow">${101+s.i}번 · ${s.i+1}/${s.list.length}</span>
    <span class="row" style="gap:6px"><span class="chip lv${q.level||1}">L${q.level||1}</span>${done?`<span class="chip">${esc(q.type)}</span>`:''}<button class="sm ghost" id="pq">그만하기</button></span></div>
    <div class="progress"><i style="width:${s.i/s.list.length*100}%"></i></div>
    <div class="sheet stack"><div class="stem">${stem}</div>
    <div class="choices">${q.choices.map((c,i)=>{const cls=done?(i===q.answer?'ok':i===s.picked?'no':''):'';
      return`<button class="choice ${cls}" data-i="${i}" ${done?'disabled':''}><span class="bub">${LET[i]}</span><span class="t">${esc(c)}</span></button>`}).join('')}</div>
    ${done?`<div class="exp ${ok?'ok':'no'}"><b>${ok?'정답':'오답 · 정답 ('+LET[q.answer]+')'}</b> ${esc(q.exp)}</div>`:''}</div>
    ${done?`<button class="primary" id="pn">다음</button>`:''}</div>`;
  V.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answerP5(+b.dataset.i));
  if(done)pn.onclick=nextP5;pq.onclick=()=>finishQ(5)}
function answerP5(i){const s=S.session;if(s.picked!=null||i<0||i>3)return;const id=s.list[s.i];const q=S.qs.get(id);s.picked=i;const ok=i===q.answer;if(ok)s.ok++;
  recordQ(id,q,[{type:q.type,ok}]);adjustLv(5,q,ok);saveSettings();rP5()}
function nextP5(){const s=S.session;s.i++;s.picked=null;rP5()}

function startP6(){const ids=pick(6,1);if(!ids.length)return;S.session={view:'p6',list:ids,i:0,ans:{},graded:false,ok:0,total:0};rP6()}
function rP6(){const s=S.session;if(s.i>=s.list.length)return finishQ(6);const id=s.list[s.i];const q=S.qs.get(id);
  const base=131;const g=s.graded;
  const passage=esc(q.passage).replace(/\[(\d)\]/g,(m,n)=>`<span class="blank">${base+(+n)-1}</span>`);
  V.innerHTML=`<div class="stack"><div class="row" style="justify-content:space-between"><span class="eyebrow">${esc(q.title||'Part 6')}</span>
    <span class="row" style="gap:6px"><span class="chip lv${q.level||1}">L${q.level||1}</span><button class="sm ghost" id="pq">그만하기</button></span></div>
    <div class="sheet"><div class="passage">${passage}</div></div>
    ${q.items.map((it,k)=>{const a=s.ans[k];return`<div class="sheet stack"><div class="row" style="justify-content:space-between"><b>${base+k}번</b>${g?`<span class="chip">${esc(it.type)}</span>`:''}</div>
      <div class="choices">${it.choices.map((c,i)=>{const cls=g?(i===it.answer?'ok':i===a?'no':''):(i===a?'sel':'');
        return`<button class="choice ${cls}" data-k="${k}" data-i="${i}" ${g?'disabled':''}><span class="bub">${LET[i]}</span><span class="t">${esc(c)}</span></button>`}).join('')}</div>
      ${g?`<div class="exp ${a===it.answer?'ok':'no'}"><b>${a===it.answer?'정답':'오답 · 정답 ('+LET[it.answer]+')'}</b> ${esc(it.exp)}</div>`:''}</div>`}).join('')}
    ${g?`<button class="primary" id="p6n">다음 지문</button>`:`<button class="primary" id="p6g" ${Object.keys(s.ans).length===q.items.length?'':'disabled'}>채점하기</button>`}</div>`;
  V.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(s.graded)return;s.ans[+b.dataset.k]=+b.dataset.i;const y=window.scrollY;rP6();window.scrollTo(0,y)});
  pq.onclick=()=>finishQ(6);
  if(g)p6n.onclick=()=>{const nx=pick(6,3).filter(x=>x!==id)[0];if(!nx)return finishQ(6);s.list.push(nx);s.i++;s.ans={};s.graded=false;rP6();window.scrollTo(0,0)};
  else p6g.onclick=()=>{s.graded=true;const res=q.items.map((it,k)=>({type:it.type,ok:s.ans[k]===it.answer}));
    res.forEach(r=>{s.total++;if(r.ok)s.ok++;adjustLv(6,q,r.ok)});recordQ(id,q,res);saveSettings();const y=window.scrollY;rP6();window.scrollTo(0,y)}}
function finishQ(part){const s=S.session;S.session=null;
  const n=part===5?Math.min(s.i+(s.picked!=null?1:0),s.list.length):s.total;const ok=s.ok;
  V.innerHTML=`<div class="stack"><div><div class="eyebrow">Part ${part} 세션 완료</div><h2>${n}문제 중 ${ok}개 정답${n?' · '+Math.round(ok/n*100)+'%':''}</h2></div>
  <div class="muted">현재 레벨 ${lvText(S.settings['lv'+part])}</div>
  <div class="row"><button class="primary" id="f1">한 번 더</button><button id="f2">약점 분석 보기</button></div></div>`;
  f1.onclick=()=>part===5?startP5():startP6();f2.onclick=()=>location.hash='stats'}

/* ---------- Claude API ---------- */
let genCtl=null;
async function claude(prompt,signal){
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal,
    headers:{'x-api-key':CFG.claudeKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true','content-type':'application/json'},
    body:JSON.stringify({model:CFG.model||MODELS[0][0],max_tokens:6000,messages:[{role:'user',content:prompt}]})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw{code:r.status,message:(j.error&&j.error.message)||('HTTP '+r.status)};
  return(j.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('')}
function parseJSON(t){try{return JSON.parse(t)}catch{}const m=t.match(/```(?:json)?\s*([\s\S]*?)```/);if(m){try{return JSON.parse(m[1])}catch{}}
  const st=[t.indexOf('['),t.indexOf('{')].filter(x=>x>=0);const s=Math.min(...st);const e=Math.max(t.lastIndexOf(']'),t.lastIndexOf('}'));
  if(st.length&&e>s)return JSON.parse(t.slice(s,e+1));throw{code:'json',message:'JSON을 찾지 못했어'}}
function validP5(x){return x&&typeof x.stem==='string'&&/-{3,}/.test(x.stem)&&Array.isArray(x.choices)&&x.choices.length===4&&x.choices.every(c=>typeof c==='string'&&c.trim())&&Number.isInteger(x.answer)&&x.answer>=0&&x.answer<4&&new Set(x.choices).size===4}
function genPrompt(part,lv,weak){
  const lvDesc={1:'Level 1 (target score ~600): common business vocabulary, clear grammar cues.',2:'Level 2 (target ~750): subtler grammar, collocations, distractors from the same word family.',3:'Level 3 (target 850+): advanced vocabulary, inversion, subjunctive, close-meaning distractors, long sentences.'}[lv];
  const focus=weak.length?`Give extra weight to these weak question types: ${weak.join(', ')}.`:'Mix the question types.';
  const existing=pool(part).slice(-30).map(([,q])=>part===5?q.stem:q.title).join('\n');
  return part===5?
`Write 8 ORIGINAL TOEIC Part 5 (incomplete sentence) questions. ${lvDesc} ${focus}
Allowed "type" values (Korean, use exactly): ${TYPES5.join(', ')}.
Each question: one business-context English sentence with exactly one blank written as "-------", four answer choices, exactly one correct.
Vary the correct position across A-D. Do not copy any published test item. Avoid repeating these existing stems:
${existing||'(none)'}
Reply with ONLY a JSON array of 8 objects, no other text:
[{"type":"품사","stem":"The manager asked for a ------- review of the budget.","choices":["thorough","thoroughly","thoroughness","more thoroughly"],"answer":0,"exp":"명사 review를 꾸미는 형용사 자리라 thorough가 정답. 부사 thoroughly는 명사를 꾸밀 수 없어."}]
"exp" must be Korean (casual 반말), 1-2 sentences, explaining why the answer is right and why the trap is wrong.`:
`Write 1 ORIGINAL TOEIC Part 6 text-completion set. ${lvDesc} ${focus}
Text: an email, notice, memo, article or letter of 90-150 words with exactly four blanks marked [1], [2], [3], [4] in order. Exactly one of the four must be a sentence-insertion item (type "문장삽입") whose choices are four full sentences.
Allowed "type" values (Korean, use exactly): ${TYPES6.join(', ')}.
Vary the correct position across A-D. Do not copy any published test item. Avoid these existing titles:
${existing||'(none)'}
Reply with ONLY one JSON object, no other text:
{"title":"Email: Office Relocation","passage":"... [1] ... [2] ... [3] ... [4] ...","items":[{"type":"품사","choices":["a","b","c","d"],"answer":0,"exp":"한국어 해설 1~2문장 (반말)"}]}  (items has exactly 4 entries)`}
async function generate(part){if(!CFG.claudeKey)return;const lv=Math.round(S.settings['lv'+part]);const weak=weakTypes(part);
  const out=document.getElementById('qgo'),btn=document.getElementById('qg'),stop=document.getElementById('qstop');
  btn.disabled=true;stop.hidden=false;out.hidden=false;out.textContent='Claude가 문제를 쓰는 중… (20~60초)';
  genCtl=new AbortController();stop.onclick=()=>genCtl.abort();
  try{const res=parseJSON(await claude(genPrompt(part,lv,weak),genCtl.signal));let saved=0;const now=Date.now();
    const rows=[];
    if(part===5){for(const x of(Array.isArray(res)?res:[])){if(!validP5(x))continue;
        rows.push({id:'c'+now.toString(36)+'-'+rows.length,part:5,level:lv,type:TYPES5.includes(x.type)?x.type:'어휘',stem:x.stem.trim(),choices:x.choices.map(String),answer:x.answer,exp:String(x.exp||''),title:null,passage:null,items:null,src:'claude',created:now+rows.length,seen:0,wrong:0})}}
    else{const x=res||{};const items=Array.isArray(x.items)?x.items:[];
      const okItems=items.length===4&&items.every(it=>Array.isArray(it.choices)&&it.choices.length===4&&Number.isInteger(it.answer)&&it.answer>=0&&it.answer<4);
      if(okItems&&typeof x.passage==='string'&&/\[1\][\s\S]*\[2\][\s\S]*\[3\][\s\S]*\[4\]/.test(x.passage))
        rows.push({id:'c'+now.toString(36),part:6,level:lv,type:null,stem:null,choices:null,answer:null,exp:null,title:String(x.title||'Part 6'),passage:x.passage,
          items:items.map(it=>({type:TYPES6.includes(it.type)?it.type:'어휘',choices:it.choices.map(String),answer:it.answer,exp:String(it.exp||'')})),src:'claude',created:now,seen:0,wrong:0})}
    if(rows.length){await upsertMany('questions',rows);for(const r of rows)S.qs.set(r.id,r);saved=rows.length}
    out.textContent=saved?`${saved}개 저장했어 (레벨 ${lv}).`:'형식이 맞는 결과가 없어서 저장하지 않았어. 다시 눌러줘.';
    toast(saved?'새 문제 '+saved+'개 저장':'저장된 문제 없음');setTimeout(()=>{if(!S.session&&S.view==='p'+part)rQuiz(part)},1200)}
  catch(e){const m=e&&e.name==='AbortError'?'중지했어.':e.code===401?'API 키가 올바르지 않아. 설정에서 다시 넣어줘.':e.code===429?'요청 한도에 걸렸어. 잠시 후 다시 해줘.':e.code===529||e.code===503?'Claude 서버가 바빠. 잠시 후 다시 해줘.':e.code===400&&/model/i.test(e.message||'')?'모델 이름이 맞지 않아. 설정에서 다른 모델을 골라줘.':'생성하지 못했어: '+String(e.message||e.code||'오류').slice(0,120);
    out.textContent=m}
  finally{btn.disabled=false;stop.hidden=true}}

/* ---------- 분석 ---------- */
function rStats(){const bars=part=>{const st=typeStats(part);const rows=Object.entries(st).sort((a,b)=>a[1].c/a[1].n-b[1].c/b[1].n);
    if(!rows.length)return'<div class="muted" style="font-size:13px">아직 풀이 기록이 없어.</div>';
    return rows.map(([t,v])=>{const p=Math.round(v.c/v.n*100);const col=p>=80?'var(--good)':p>=60?'var(--omr)':'var(--bad)';
      return`<div class="bar"><span>${esc(t)}</span><span class="track"><i style="width:${p}%;background:${col}"></i></span><span class="v">${p}% · ${v.c}/${v.n}</span></div>`}).join('')};
  const tot=part=>{let n=0,c=0;for(const v of Object.values(typeStats(part))){n+=v.n;c+=v.c}return n?Math.round(c/n*100)+'%':'–'};
  const days=[];let mx=1;for(let i=13;i>=0;i--){const t=new Date(Date.now()-i*DAY);const d=S.days.get(todayId(t))||{};let qn=0;for(const v of Object.values(d.q||{}))qn+=v.n;
    days.push({l:t.getDate(),w:d.words_reviewed||0,q:qn});mx=Math.max(mx,(d.words_reviewed||0)+qn)}
  let nw=0,ln=0,mt=0;for(const id of S.words.keys()){const s=wordStatus(id);s==='new'?nw++:s==='mature'?mt++:ln++}
  const hard=[...S.srs.entries()].filter(([id,s])=>s.lapses&&S.words.has(id)).sort((a,b)=>b[1].lapses-a[1].lapses).slice(0,8);
  V.innerHTML=`<div class="stack"><div><div class="eyebrow">약점 분석</div><h2>유형별 정답률</h2></div>
  <div class="sheet stack"><div class="row" style="justify-content:space-between"><b>Part 5</b><span class="muted" style="font-size:13px">전체 ${tot(5)} · 레벨 ${lvText(S.settings.lv5)}</span></div>${bars(5)}</div>
  <div class="sheet stack"><div class="row" style="justify-content:space-between"><b>Part 6</b><span class="muted" style="font-size:13px">전체 ${tot(6)} · 레벨 ${lvText(S.settings.lv6)}</span></div>${bars(6)}</div>
  <div class="sheet stack"><b>최근 14일 학습량</b>
    <div class="days" role="img" aria-label="최근 14일 단어와 문제 학습량">${days.map(d=>`<div title="${d.l}일 · 단어 ${d.w} · 문제 ${d.q}"><i style="height:${d.w/mx*100}%;background:var(--omr)"></i><i style="height:${d.q/mx*100}%;background:var(--mark)"></i></div>`).join('')}</div>
    <div class="daylbl">${days.map(d=>`<span>${d.l}</span>`).join('')}</div>
    <div class="legend"><span><i style="background:var(--omr)"></i>단어</span><span><i style="background:var(--mark)"></i>문제</span><span>최대 ${mx}</span></div></div>
  <div class="sheet stack"><b>단어 상태</b><div class="grid3">
    <div class="tile"><div class="n">${nw}</div><div class="l">아직 안 본 단어</div></div>
    <div class="tile"><div class="n">${ln}</div><div class="l">학습 중</div></div>
    <div class="tile"><div class="n">${mt}</div><div class="l">장기 기억 (간격 21일+)</div></div></div>
    ${hard.length?`<div><div class="eyebrow" style="margin-bottom:6px">자주 틀리는 단어</div>${hard.map(([id,s])=>{const w=S.words.get(id);return`<div class="witem"><div><span class="w">${esc(w.w)}</span> <span class="k">${esc(w.ko)}</span></div><span class="chip">${s.lapses}회</span></div>`}).join('')}</div>`:''}
  </div></div>`}

/* ---------- 단어장 + 설정 ---------- */
let deckQ='',deckLv='',delArm=null,editId=null;
function slug(w){return(w.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'w')+'-'+Math.random().toString(36).slice(2,6)}
function addWord(o){const id=slug(o.w);const doc={w:o.w.trim(),pos:(o.pos||'').trim(),ko:o.ko.trim(),ex:(o.ex||'').trim(),lv:+o.lv||1,created:Date.now()};S.words.set(id,doc);return[id,doc]}
function rDeck(){const st={new:'새',learning:'학습 중',mature:'장기'};
  const list=[...S.words.entries()].filter(([,w])=>(!deckLv||String(w.lv||1)===deckLv)&&(!deckQ||(w.w+' '+w.ko).toLowerCase().includes(deckQ.toLowerCase())))
    .sort((a,b)=>a[1].w.localeCompare(b[1].w));
  V.innerHTML=`<div class="stack"><div><div class="eyebrow">데이터베이스 · words</div><h2>단어장</h2></div>
  <div class="sheet stack"><b>단어 추가</b>
    <form id="af" class="stack"><div class="row">
      <label class="f">단어<input id="aw" required placeholder="expedite" autocapitalize="off"></label>
      <label class="f">뜻<input id="ak" required placeholder="신속히 처리하다"></label></div>
      <div class="row"><label class="f" style="flex:0 1 90px">품사<input id="ap" placeholder="v" autocapitalize="off"></label>
      <label class="f" style="flex:0 1 110px">레벨<select id="al"><option value="1">1 기본</option><option value="2">2 중급</option><option value="3">3 고난도</option></select></label>
      <label class="f">예문<input id="ae" placeholder="We will expedite your order."></label></div>
      <div class="row"><button class="primary" type="submit">추가</button></div></form>
    <details><summary style="cursor:pointer;font-size:14px">여러 개 붙여넣기</summary>
      <div class="stack" style="margin-top:8px"><div class="muted" style="font-size:13px">한 줄에 하나씩: <code>단어 | 뜻 | 품사 | 레벨 | 예문</code> (품사 이후는 생략 가능). 탭으로 구분된 엑셀 복사도 돼.</div>
      <textarea id="bulk" placeholder="allocate | 할당하다 | v | 2 | The funds were allocated to marketing."></textarea>
      <div class="row"><button id="bulkgo">일괄 추가</button></div></div></details>
  </div>
  <div class="sheet stack"><div class="row" style="justify-content:space-between"><b>${list.length} / ${S.words.size}개</b></div>
    <div class="row"><input id="dq" placeholder="검색" value="${esc(deckQ)}" style="flex:1 1 160px" aria-label="단어 검색">
      <select id="dl" aria-label="레벨 필터"><option value="">전체 레벨</option>${[1,2,3].map(l=>`<option value="${l}" ${deckLv==l?'selected':''}>L${l}</option>`).join('')}</select></div>
    <div class="wlist">${list.slice(0,300).map(([id,w])=>editId===id?`
      <div class="witem" style="grid-template-columns:minmax(0,1fr)"><div class="stack" style="gap:8px">
        <div class="row"><input id="ew" value="${esc(w.w)}" style="flex:1 1 120px" aria-label="단어"><input id="ek" value="${esc(w.ko)}" style="flex:1 1 140px" aria-label="뜻"></div>
        <div class="row"><input id="ep" value="${esc(w.pos)}" style="flex:0 1 70px" aria-label="품사"><select id="el" aria-label="레벨">${[1,2,3].map(l=>`<option ${w.lv==l?'selected':''}>${l}</option>`).join('')}</select>
        <input id="ee" value="${esc(w.ex)}" style="flex:1 1 180px" aria-label="예문"></div>
        <div class="row"><button class="sm primary" data-save="${esc(id)}">저장</button><button class="sm ghost" data-cancel>취소</button></div></div></div>`:`
      <div class="witem"><div style="min-width:0"><span class="w">${esc(w.w)}</span> <span class="pos">${esc(w.pos)}</span><div class="k">${esc(w.ko)}</div></div>
        <div class="acts"><span class="chip lv${w.lv||1}">L${w.lv||1}</span><span class="chip">${st[wordStatus(id)]}</span>
        <button class="sm ghost" data-edit="${esc(id)}" aria-label="${esc(w.w)} 수정">수정</button>
        <button class="sm ghost" data-del="${esc(id)}" style="${delArm===id?'color:var(--bad);border-color:var(--bad)':''}">${delArm===id?'삭제 확인':'삭제'}</button></div></div>`).join('')}
      ${list.length>300?'<div class="muted" style="padding:8px 0;font-size:13px">300개까지만 보여. 검색으로 좁혀줘.</div>':''}</div></div>
  <div class="sheet stack"><div class="eyebrow">설정</div>
    <div class="row"><label class="f" style="flex:0 1 180px">하루 새 단어 수<input id="dn" type="number" min="0" max="100" value="${S.settings.daily_new??15}"></label>
      <button id="dns" class="sm" style="align-self:flex-end">저장</button></div>
    <label class="f">Claude API 키 (이 기기에만 저장)<input id="ck" type="password" placeholder="sk-ant-..." value="${esc(CFG.claudeKey||'')}" autocomplete="off"></label>
    <label class="f">문제 생성 모델<select id="cm">${MODELS.map(([v,l])=>`<option value="${v}" ${(CFG.model||MODELS[0][0])===v?'selected':''}>${l}</option>`).join('')}</select></label>
    <div class="row"><button id="cks" class="sm">API 설정 저장</button></div>
    <div class="muted" style="font-size:12px">Supabase: ${esc(CFG.url||'')} · ${esc(CFG.email||'')}</div>
    <div class="row"><button id="lo" class="sm ghost">로그아웃</button></div>
  </div></div>`;
  af.onsubmit=e=>{e.preventDefault();const[id,doc]=addWord({w:aw.value,ko:ak.value,pos:ap.value,lv:al.value,ex:ae.value});upsert('words',id,doc);toast(doc.w+' 추가');rDeck();document.getElementById('aw').focus()};
  bulkgo.onclick=async()=>{const rows=[];for(const line of bulk.value.split('\n')){const p=line.split(/\s*[|\t]\s*/);if(p.length<2||!p[0].trim()||!p[1].trim())continue;
      const lv=/^[123]$/.test(p[3]||'')?p[3]:1;const[id,doc]=addWord({w:p[0],ko:p[1],pos:p[2]||'',lv,ex:p[4]||''});rows.push({id,...doc})}
    if(!rows.length)return toast('추가할 줄이 없어. 형식을 확인해줘');
    bulkgo.disabled=true;try{await upsertMany('words',rows);toast(rows.length+'개 추가했어')}catch(e){toast(errText(e))}rDeck()};
  dns.onclick=()=>{S.settings.daily_new=clamp(parseInt(dn.value)||0,0,100);saveSettings();toast('하루 새 단어 '+S.settings.daily_new+'개')};
  cks.onclick=()=>{CFG={...CFG,claudeKey:ck.value.trim(),model:cm.value};LS.set('omr.cfg',CFG);toast('API 설정을 저장했어')};
  lo.onclick=()=>{TOK=null;LS.del('omr.tok');S.ready=false;render()};
  dq.oninput=()=>{deckQ=dq.value;const pos=dq.selectionStart;rDeck();const n=document.getElementById('dq');n.focus();n.setSelectionRange(pos,pos)};
  dl.onchange=()=>{deckLv=dl.value;rDeck()};
  V.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const id=b.dataset.del;if(delArm!==id){delArm=id;rDeck();return}
    delArm=null;S.words.delete(id);S.srs.delete(id);remove('words',id);remove('srs',id);toast('삭제했어');rDeck()});
  V.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editId=b.dataset.edit;delArm=null;rDeck()});
  V.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>{editId=null;rDeck()});
  V.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{const id=b.dataset.save;const old=S.words.get(id);if(!ew.value.trim()||!ek.value.trim())return toast('단어와 뜻은 비울 수 없어');
    const doc={...clone(old),w:ew.value.trim(),ko:ek.value.trim(),pos:ep.value.trim(),lv:+el.value,ex:ee.value.trim()};S.words.set(id,doc);upsert('words',id,doc);editId=null;toast('저장했어');rDeck()});
}

/* ---------- 시작 ---------- */
async function refresh(force){if(!TOK||S.session)return;try{await loadAll();if(force)toast('최신 기록을 불러왔어');render()}catch(e){setSync('오프라인');if(e.code==='auth'){render()}else if(force)toast(errText(e))}}
async function start(){if(!CFG.url||!TOK)return render();try{await loadAll()}catch(e){if(e.code==='auth')return render();setSync('불러오기 실패');V.innerHTML=`<div class="note">데이터를 불러오지 못했어 (${esc(e.code||'')}). ${esc(String(e.message||'').slice(0,120))}<br><button class="sm" onclick="start()">다시 시도</button></div>`;return}render()}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refresh(false)});  // 잠금화면 퀴즈 기록 반영
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
go();start();
</script>
</body>
